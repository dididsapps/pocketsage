name: Politesse — traductions + MP3 automatiques

# Se lance quand data/politesse/fr.json (contenu Politesse) est modifié sur main.
# Traduit les cartes nouvelles/modifiées, génère leurs MP3, les envoie sur R2,
# puis recommite les fichiers traduits (data/flash/*.json).
on:
  push:
    branches: [main]
    paths:
      - "data/politesse/fr.json"
      - "gen_politesse.py"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: politesse-tts
  cancel-in-progress: false

jobs:
  politesse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install requests boto3

      - name: Vérifier les secrets
        id: chk
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
        run: |
          if [ -z "$GOOGLE_TTS_API_KEY" ] || [ -z "$R2_ACCESS_KEY" ] || [ -z "$R2_SECRET_KEY" ]; then
            echo "::warning::Secrets GOOGLE_TTS_API_KEY / R2_ACCESS_KEY / R2_SECRET_KEY absents — étape ignorée. Voir docs/flash/03_procedures_mp3_traductions.md"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Traductions + MP3 + upload R2
        if: steps.chk.outputs.ok == 'true'
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
        run: python3 gen_politesse.py

      - name: Recommiter les fichiers traduits
        # Même en cas d'erreur partielle, on garde ce qui a été fait (le manifest évite de refaire).
        if: always() && steps.chk.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/politesse/
          if git diff --cached --quiet; then
            echo "Rien à commiter"
          else
            # Pas de [skip ci] : Cloudflare Pages doit redéployer avec les traductions.
            git commit -m "chore(politesse): traductions + MP3 auto"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
