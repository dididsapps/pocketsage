name: Parcours — voix et fiches

on:
  push:
    branches: [main]
    paths:
      - "docs/parcours/PC-*.json"
      - "fiches/**/PC-*.pdf"
      - "tools/parcours_tts.py"
  workflow_dispatch: {}

concurrency:
  group: parcours-tts
  cancel-in-progress: false

jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get install -y -qq ffmpeg && pip install requests boto3
      - env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
        run: python3 tools/parcours_tts.py
