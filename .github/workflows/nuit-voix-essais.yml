name: Nuit — échantillons de voix

on:
  push:
    branches: [main]
    paths: ["tools/nuit_voix_essais.py"]
  workflow_dispatch: {}

jobs:
  essais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get install -y ffmpeg >/dev/null && pip install requests boto3
      - env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
        run: python3 tools/nuit_voix_essais.py
