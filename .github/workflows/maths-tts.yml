name: Maths — MP3 avec symboles dits en mots

# Réenregistre (Google TTS) les questions/réponses contenant ×, ÷, ≠, ², √…
# en lisant les symboles en mots, les envoie sur R2 et met à jour data/audio_maths.json.
# Incrémental : seuls les textes nouveaux ou modifiés sont refaits.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tools/maths_tts.py"
      - "tools/parle.py"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: maths-tts
  cancel-in-progress: false

jobs:
  maths:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests boto3
      - name: Vérifier les secrets
        id: chk
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
        run: |
          if [ -z "$GOOGLE_TTS_API_KEY" ] || [ -z "$R2_ACCESS_KEY" ] || [ -z "$R2_SECRET_KEY" ]; then
            echo "::warning::Secrets absents — étape ignorée"; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: MP3 + upload R2
        if: steps.chk.outputs.ok == 'true'
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
        run: python3 tools/maths_tts.py
      - name: Recommiter le manifeste
        if: always() && steps.chk.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/audio_maths.json data/audio_maths_etat.json
          if git diff --cached --quiet; then echo "Rien à commiter"; else
            git commit -m "chore(maths): MP3 symboles en mots"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
