name: Nuit — MP3 manquants (histoires, respirées, méditations)

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tools/nuit_tts.py"
  workflow_dispatch: {}

concurrency:
  group: nuit-tts
  cancel-in-progress: false

jobs:
  nuit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y ffmpeg >/dev/null && pip install requests boto3
      - name: MP3 nuit manquants + upload R2
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
        run: python3 tools/nuit_tts.py
