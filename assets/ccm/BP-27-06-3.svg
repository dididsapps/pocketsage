<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Fiche du stylo : propriété, limite, prix fictif et inclusions, tous visibles avant le choix</title><style>.l1{animation:cl1 8s infinite}@keyframes cl1{0%{opacity:.12}6%,92%{opacity:1}100%{opacity:.12}}.l2{animation:cl2 8s infinite}@keyframes cl2{0%,15%{opacity:.12}21%,92%{opacity:1}100%{opacity:.12}}.l3{animation:cl3 8s infinite}@keyframes cl3{0%,30%{opacity:.12}36%,92%{opacity:1}100%{opacity:.12}}.l4{animation:cl4 8s infinite}@keyframes cl4{0%,45%{opacity:.12}51%,92%{opacity:1}100%{opacity:.12}}.ch{animation:cch 8s infinite}@keyframes cch{0%,62%{opacity:.12}68%,92%{opacity:1}100%{opacity:.12}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="20" width="240" height="220" rx="10" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><text x="140" y="46" font-size="15" fill="#2B3A55">fiche du stylo</text><g class="l1"><rect x="34" y="64" width="212" height="32" rx="8" fill="#E2E8F0"/><circle cx="52" cy="80" r="7" fill="#10B981"/><text x="66" y="85" font-size="14" fill="#2B3A55" text-anchor="start">propriété connue</text></g><g class="l2"><rect x="34" y="106" width="212" height="32" rx="8" fill="#E2E8F0"/><circle cx="52" cy="122" r="7" fill="#F59E0B"/><text x="66" y="127" font-size="14" fill="#2B3A55" text-anchor="start">limite connue</text></g><g class="l3"><rect x="34" y="148" width="212" height="32" rx="8" fill="#E2E8F0"/><circle cx="52" cy="164" r="7" fill="#8B5CF6"/><text x="66" y="169" font-size="14" fill="#2B3A55" text-anchor="start">prix fictif</text></g><g class="l4"><rect x="34" y="190" width="212" height="32" rx="8" fill="#E2E8F0"/><circle cx="52" cy="206" r="7" fill="#3B82F6"/><text x="66" y="211" font-size="14" fill="#2B3A55" text-anchor="start">ce qui est inclus</text></g><g class="ch"><line x1="266" y1="130" x2="300