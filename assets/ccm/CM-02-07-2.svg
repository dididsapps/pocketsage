<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>La chaleur progresse depuis les faces : le centre d’un bloc épais reste froid plus longtemps</title><style>.h{animation:h 5s ease-in infinite}@keyframes h{from{stroke-width:0}to{stroke-width:64}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><clipPath id="m"><rect x="40" y="70" width="50" height="120" rx="6"/></clipPath><clipPath id="e"><rect x="170" y="40" width="180" height="180" rx="6"/></clipPath><rect x="40" y="70" width="50" height="120" rx="6" fill="#06B6D4" fill-opacity=".45"/><rect class="h" clip-path="url(#m)" x="40" y="70" width="50" height="120" rx="6" fill="none" stroke="#EF4444" stroke-opacity=".7" stroke-width="40"/><rect x="40" y="70" width="50" height="120" rx="6" fill="none" stroke="#2B3A55" stroke-width="3"/><rect x="170" y="40" width="180" height="180" rx="6" fill="#06B6D4" fill-opacity=".45"/><rect class="h" clip-path="url(#e)" x="170" y="40" width="180" height="180" rx="6" fill="none" stroke="#EF4444" stroke-opacity=".7" stroke-width="40"/><rect x="170" y="40" width="180" height="180" rx="6" fill="none" stroke="#2B3A55" stroke-width="3"/><text x="65" y="214" font-size="14" fill="#2B3A55">mince</text><text x="260" y="244" font-size="14" fill="#2B3A55">épais</text><text x="260" y="126" font-size="13" fill="#3B82F6">centre</text><text x="260" y="142" font-size="13" fill="#3B82F6">encore froid</text></g></svg>