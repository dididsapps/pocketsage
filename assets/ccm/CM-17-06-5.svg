<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Balance : production et consommation s’équilibrent grâce au stockage et au réglage</title><style>.fl{stroke-dasharray:0 14;animation:fl 3s linear infinite}@keyframes fl{to{stroke-dashoffset:-56}}.da{stroke-dasharray:8 8;animation:da 2s linear infinite}@keyframes da{to{stroke-dashoffset:-32}}.pu{animation:pu 3s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}.bm{transform-origin:200px 90px;animation:bm 6s infinite}@keyframes bm{0%,15%,65%,100%{transform:rotate(0)}30%,50%{transform:rotate(6deg)}}.lp{animation:lp 6s infinite}@keyframes lp{0%,15%,65%,100%{transform:translateY(0)}30%,50%{transform:translateY(-11px)}}.rp{animation:rp 6s infinite}@keyframes rp{0%,15%,65%,100%{transform:translateY(0)}30%,50%{transform:translateY(11px)}}.x1{animation:x1 6s infinite}@keyframes x1{0%,10%{opacity:0}18%,85%{opacity:1}95%,100%{opacity:0}}.x2{animation:x2 6s infinite}@keyframes x2{0%,50%{opacity:0}60%,85%{opacity:1}95%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><path d="M200 210L180 240H220Z" stroke="#2B3A55" stroke-width="3" fill="#E2E8F0"/><line x1="200" y1="90" x2="200" y2="210" stroke="#2B3A55" stroke-width="4"/><g class="bm"><line x1="90" y1="90" x2="310" y2="90" stroke="#2B3A55" stroke-width="5"/></g><g class="lp"><line x1="90" y1="90" x2="90" y2="140" stroke="#2B3A55" stroke-width="2"/><path d="M55 140h70l-10 18h-50z" stroke="#2B3A55" stroke-width="3" fill="#FFFFFF"/><rect x="70" y="118" width="40" height="22" rx="3" fill="#10B981" stroke="#2B3A55" stroke-width="2"/><rect x="70" y="96" width="40" height="22" rx="3" fill="#10B981" stroke="#2B3A55" stroke-width="2" class="x2"/></g><g class="rp"><line x1="310" y1="90" x2="310" y2="140" stroke="#2B3A55" stroke-width="2"/><path d="M275 140h70l-10 18h-50z" stroke="#2B3A55" stroke-width="3" fill="#FFFFFF"/><rect x="290" y="118" width="40" height="22" rx="3" fill="#F97316" stroke="#2B3A55" stroke-width="2"/><rect x="290" y="96" width="40" height="22" rx="3" fill="#F97316" stroke="#2B3A55" stroke-width="2" class="x1"/></g><text x="90" y="190" font-size="14" fill="#2B3A55">production</text><text x="310" y="190" font-size="14" fill="#2B3A55">consommation</text><rect x="186" y="40" width="28" height="36" rx="4" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><text x="200" y="65" font-size="12" fill="#2B3A55"></text><path d="M150 50a15 15 0 0 1 20 -12M250 50a15 15 0 0 0 -20 -12" stroke="#94A3B8" stroke-width="3" fill="none"/><text x="200" y="25" font-size="13" fill="#94A3B8">stockage et réglage</text></g></svg>