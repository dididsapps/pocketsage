<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Intensité : charges qui traversent une section chaque seconde</title><style>.f{animation:f 2s linear infinite}@keyframes f{to{stroke-dashoffset:-28}}.n{opacity:0;animation:n 4s steps(1) infinite}.n2{animation-delay:1s}.n3{animation-delay:2s}.n4{animation-delay:3s}@keyframes n{0%{opacity:1}25%,100%{opacity:0}}.n1{opacity:1}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="140" width="360" height="50" rx="25" fill="#E2E8F0" stroke="#94A3B8" stroke-width="4"/><path d="M30 165H370" stroke="#3B82F6" stroke-width="8" fill="none" stroke-dasharray="0 14" class="f"/><line x1="200" y1="124" x2="200" y2="206" stroke="#2B3A55" stroke-width="3" stroke-dasharray="6 6"/><text x="200" y="224" font-size="13" fill="#2B3A55">section du fil</text><rect x="140" y="40" width="120" height="50" rx="8" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><text x="200" y="74" font-size="22" fill="#3B82F6" class="n n1">1</text><text x="200" y="74" font-size="22" fill="#3B82F6" class="n n2">2</text><text x="200" y="74" font-size="22" fill="#3B82F6" class="n n3">3</text><text x="200" y="74" font-size="22" fill="#3B82F6" class="n n4">4</text><text x="200" y="28" font-size="14" fill="#2B3A55">charges par seconde</text><line x1="200" y1="92" x2="200" y2="122" stroke="#2B3A55" stroke-width="2"/><text x="200" y="252" font-size="14" fill="#2B3A55">intensité : ampères (A)</text></g></svg>