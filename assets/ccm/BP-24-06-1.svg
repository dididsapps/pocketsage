<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Reconnaître son action mène à la réparation ; l’étiquette sur l’autre est barrée</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><g><rect x="20" y="39" width="180" height="42" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="3"/><text x="110" y="64.5" font-size="13" fill="#2B3A55">J’ai déchiré ta feuille.</text></g><path d="M200 60L262 60" stroke="#10B981" stroke-width="3" fill="none"/><path d="M252.1 64.8L262 60L252.1 55.2" stroke="#10B981" stroke-width="3" fill="none"/><g transform="translate(310 62) scale(0.8)"><rect x="-20" y="-26" width="40" height="52" rx="4" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><path d="M-11 -12H11M-11 -2H11M-11 8H4" stroke="#94A3B8" stroke-width="2"/><rect x="-6" y="-24" width="12" height="48" rx="2" fill="#06B6D4" opacity=".55"/></g><text x="310" y="115" font-size="14" fill="#2B3A55">réparer</text><g><rect x="20" y="154" width="180" height="42" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3" stroke-dasharray="7 6"/><text x="110" y="179.6" font-size="13" fill="#2B3A55">Tu es trop sensible.</text></g><path d="M28 192L192 158" stroke="#EF4444" stroke-width="4"/><text x="110" y="220" font-size="13" fill="#94A3B8">étiquette sur l’autre</text><text x="110" y="105" font-size="13" fill="#3B82F6">action reconnue</text></g></svg>