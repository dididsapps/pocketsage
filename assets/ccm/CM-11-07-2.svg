<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Barème fictif en escalier : 0 % puis 10 %, soit 100 € d’impôt pour 2 000 €</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="90" y="12" width="220" height="30" rx="8" fill="#F59E0B" stroke="#2B3A55" stroke-width="2"/><text x="200" y="33" font-size="15" fill="#FFFFFF">barème fictif</text><path d="M30 200H180V140H340" stroke="#2B3A55" stroke-width="3" fill="none"/><rect x="30" y="150" width="150" height="50" rx="4" fill="#E2E8F0" stroke="#2B3A55" stroke-width="3"/><text x="105" y="172" font-size="13" fill="#2B3A55">1 000 € à 0 %</text><text x="105" y="190" font-size="13" fill="#2B3A55">→ 0 €</text><rect x="180" y="90" width="160" height="50" rx="4" fill="#3B82F6" stroke="#2B3A55" stroke-width="3"/><text x="260" y="112" font-size="13" fill="#FFFFFF">1 000 € à 10 %</text><text x="260" y="130" font-size="13" fill="#FFFFFF">→ 100 €</text><path d="M30 200V210M180 200V210M340 140V210" stroke="#94A3B8" stroke-width="2" fill="none"/><path d="M30 206H340" stroke="#94A3B8" stroke-width="2" fill="none"/><text x="185" y="226" font-size="13" fill="#94A3B8">revenu de 2 000 €</text><text x="200" y="254" font-size="15" fill="#2B3A55">0 + 100 = 100 € d’impôt</text><text x="110" y="76" font-size="13" fill="#94A3B8">étage 1</text><text x="260" y="76" font-size="13" fill="#94A3B8">étage 2</text></g></svg>