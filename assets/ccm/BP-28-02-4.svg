<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Plan de cinq blocs : l’anecdote et le détail s’effacent, les trois blocs essentiels restent en place</title><style>.fd{animation:fd 5s ease-in-out infinite}@keyframes fd{0%,20%{opacity:1}50%,85%{opacity:.15}100%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><text x="200" y="40" font-size="14" fill="#2B3A55">plan complet</text><g><rect x="8" y="70" width="72" height="110" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="4"/><text x="44" y="130" font-size="13" fill="#2B3A55">idée</text></g><g class="fd"><rect x="86" y="70" width="72" height="110" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3" stroke-dasharray="7 6"/><text x="122" y="130" font-size="13" fill="#2B3A55">anecdote</text></g><g><rect x="164" y="70" width="72" height="110" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="4"/><text textLength="64" lengthAdjust="spacingAndGlyphs" x="200" y="130" font-size="13" fill="#2B3A55">explication</text></g><g class="fd"><rect x="242" y="70" width="72" height="110" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3" stroke-dasharray="7 6"/><text x="278" y="130" font-size="13" fill="#2B3A55">détail</text></g><g><rect x="320" y="70" width="72" height="110" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="4"/><text x="356" y="130" font-size="13" fill="#2B3A55">exemple</text></g><text x="200" y="220" font-size="13" fill="#2B3A55">les trois essentiels gardent</text><text x="200" y="238" font-size="13" fill="#2B3A55">leur taille et leur place</text><text x="122" y="200" font-size="13" fill="#94A3B8">secondaire</text><text x="278" y="200" font-size="13" fill="#94A3B8">secondaire</text></g></svg>