<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Mitigeur : eau froide et eau chaude mélangées en proportions variables</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><path d="M30 70H130Q160 70 170 110" stroke="#EF4444" fill="none"><animate attributeName="stroke-width" values="12;4;12" dur="4s" repeatCount="indefinite"/></path><path d="M30 190H130Q160 190 170 150" stroke="#3B82F6" fill="none"><animate attributeName="stroke-width" values="4;12;4" dur="4s" repeatCount="indefinite"/></path><circle cx="200" cy="130" r="38" fill="#8B5CF6" stroke="#2B3A55" stroke-width="3" fill-opacity=".25"/><text x="200" y="135" font-size="13" fill="#2B3A55">mélange</text><g><line x1="240" y1="130" x2="355.4" y2="130" stroke="#F97316" stroke-width="8"/><polygon points="370,130 349.2,143.6 349.2,116.4" fill="#F97316" stroke="#F97316" stroke-width="2"/></g><text x="80" y="54" font-size="13" fill="#2B3A55">eau chaude</text><text x="80" y="216" font-size="13" fill="#2B3A55">eau froide</text><text x="310" y="112" font-size="13" fill="#2B3A55">sortie</text><text x="310" y="160" font-size="13" fill="#94A3B8">température</text><text x="310" y="176" font-size="13" fill="#94A3B8">selon le mélange</text><text x="200" y="248" font-size="13" fill="#94A3B8">proportions qui varient</text></g></svg>