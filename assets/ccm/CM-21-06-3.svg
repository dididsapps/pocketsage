<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Un message passe d’un neurone à l’autre grâce à de petites molécules</title><style>.m{animation:m 2.5s linear infinite}@keyframes m{to{stroke-dashoffset:-40}}.o{animation:o 2.5s ease-in-out infinite}@keyframes o{from{transform:translateX(-6px);opacity:.3}to{transform:translateX(8px);opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><line x1="20" y1="130" x2="178" y2="130" stroke="#F59E0B" stroke-width="6"/><line x1="20" y1="130" x2="178" y2="130" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="3 17" class="m"/><circle cx="186" cy="130" r="14" fill="#FDE68A" stroke="#2B3A55" stroke-width="2.5"/><path d="M226 116Q216 130 226 144" stroke="#2B3A55" stroke-width="3" fill="none"/><line x1="226" y1="130" x2="280" y2="130" stroke="#F59E0B" stroke-width="6"/><circle cx="302" cy="130" r="22" fill="#FDE68A" stroke="#2B3A55" stroke-width="2.5"/><line x1="324" y1="130" x2="390" y2="130" stroke="#F59E0B" stroke-width="6"/><g class="o"><circle cx="206" cy="122" r="3.5" fill="#8B5CF6"/><circle cx="210" cy="134" r="3.5" fill="#8B5CF6"/><circle cx="204" cy="142" r="3.5" fill="#8B5CF6"/></g><g><line x1="40" y1="104" x2="142" y2="104" stroke="#92400E" stroke-width="3"/><polygon points="150,104 140,110 140,98" fill="#92400E" stroke="#92400E" stroke-width="2"/></g><text x="95" y="94" font-size="14" fill="#92400E">signal</text><g><line x1="250" y1="104" x2="362" y2="104" stroke="#92400E" stroke-width="3"/><polygon points="370,104 360,110 360,98" fill="#92400E" stroke="#92400E" stroke-width="2"/></g><text x="310" y="94" font-size="14" fill="#92400E">réponse</text><text x="208" y="188" font-size="13" fill="#8B5CF6">molécules</text><line x1="208" y1="176" x2="207" y2="148" stroke="#94A3B8" stroke-width="1.5"/><text x="208" y="206" font-size="12" fill