<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Un message, un temps d’attente, éventuellement une seule relance</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><line x1="20" y1="180" x2="380" y2="180" stroke="#94A3B8" stroke-width="3"/><g><rect x="20" y="100" width="90" height="40" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="3"/><path d="M32 138L40 160L48 138" fill="#FFFFFF" stroke="#3B82F6" stroke-width="3"/></g><path d="M34 116H96M34 126H74" stroke="#94A3B8" stroke-width="4"/><text x="65" y="206" font-size="14" fill="#2B3A55">message</text><circle cx="200" cy="120" r="30" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><path d="M200 120V100" stroke="#2B3A55" stroke-width="3"/><path d="M200 120L214 128" stroke="#06B6D4" stroke-width="3"><animateTransform attributeName="transform" type="rotate" from="0 200 120" to="360 200 120" dur="4s" repeatCount="indefinite"/></path><text x="200" y="206" font-size="14" fill="#2B3A55">attente</text><path d="M110 180H170M230 180H290" stroke="#06B6D4" stroke-width="3" stroke-dasharray="2 8"/><g><rect x="290" y="100" width="90" height="40" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 5"/><path d="M302 138L310 160L318 138" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 5"/></g><path d="M304 120H366" stroke="#94A3B8" stroke-width="4"/><text x="335" y="206" font-size="14" fill="#2B3A55">relance ?</text><text x="335" y="224" font-size="12" fill="#94A3B8">une seule</text><g opacity=".7"><path d="M188 52Q188 34 200 34Q212 34 212 52L216 60H184Z" fill="none" stroke="#94A3B8" stroke-width="3"/><path d="M184 32L216 64M216 32L184 64" stroke="#EF4444" stroke-width="3"/></g></g></svg>