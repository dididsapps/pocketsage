<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Bilan : 1 d’électricité + 2 pris dehors = 3 de chaleur dedans</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="100" r="18" fill="#F97316" stroke="#2B3A55" stroke-width="2"/><line x1="84" y1="100" x2="100" y2="100" stroke="#2B3A55" stroke-width="4"/><line x1="92" y1="92" x2="92" y2="108" stroke="#2B3A55" stroke-width="4"/><circle cx="130" cy="100" r="18" fill="#3B82F6" stroke="#2B3A55" stroke-width="2"/><circle cx="172" cy="100" r="18" fill="#3B82F6" stroke="#2B3A55" stroke-width="2"/><line x1="208" y1="94" x2="226" y2="94" stroke="#2B3A55" stroke-width="4"/><line x1="208" y1="106" x2="226" y2="106" stroke="#2B3A55" stroke-width="4"/><circle cx="262" cy="100" r="18" fill="#EF4444" stroke="#2B3A55" stroke-width="2"/><circle cx="304" cy="100" r="18" fill="#EF4444" stroke="#2B3A55" stroke-width="2"/><circle cx="346" cy="100" r="18" fill="#EF4444" stroke="#2B3A55" stroke-width="2"/><text x="50" y="146" font-size="14" fill="#2B3A55">électricité</text><text x="151" y="146" font-size="14" fill="#2B3A55">dehors</text><text x="304" y="146" font-size="14" fill="#2B3A55">dedans</text><text x="50" y="166" font-size="14" fill="#2B3A55">1 kWh</text><text x="151" y="166" font-size="14" fill="#2B3A55">2 kWh</text><text x="304" y="166" font-size="14" fill="#2B3A55">3 kWh</text><rect x="80" y="200" width="240" height="36" rx="8" fill="#FFFFFF" stroke="#2B3A55" stroke-width="2"/><text x="200" y="223" font-size="14" fill="#2B3A55">exemple, performance variable</text></g></svg>