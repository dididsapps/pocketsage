<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Le cadenas chiffre le trajet mais ne garantit pas le site</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(46 90) scale(1)"><circle cx="0" cy="0" r="11" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><path d="M-17 42V30Q-17 16 0 16Q17 16 17 30V42Z" stroke="#2B3A55" stroke-width="3" fill="#3B82F6"/></g><rect x="90" y="100" width="200" height="40" rx="20" fill="#CFFAFE" stroke="#06B6D4" stroke-width="3"/><circle r="5" fill="#06B6D4"><animateMotion dur="3s" repeatCount="indefinite" path="M100 120H280"/></circle><circle r="5" fill="#06B6D4"><animateMotion dur="3s" begin="-1.5s" repeatCount="indefinite" path="M100 120H280"/></circle><g transform="translate(190 82) scale(1.2)"><path d="M-7 -2V-8Q-7 -16 0 -16Q7 -16 7 -8V-2" stroke="#2B3A55" stroke-width="3" fill="none"/><rect x="-11" y="-2" width="22" height="18" rx="4" fill="#10B981" stroke="#2B3A55" stroke-width="2.5"/><circle cx="0" cy="6" r="2.5" fill="#2B3A55"/></g><text x="190" y="166" font-size="13" fill="#06B6D4">échanges chiffrés</text><rect x="300" y="70" width="90" height="100" rx="8" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><path d="M300 90H390" stroke="#2B3A55" stroke-width="2" fill="none"/><circle cx="310" cy="80" r="3" fill="#94A3B8" stroke="#94A3B8" stroke-width="1"/><circle cx="320" cy="80" r="3" fill="#94A3B8" stroke="#94A3B8" stroke-width="1"/><circle cx="345" cy="128" r="18" fill="#F59E0B" stroke="#2B3A55" stroke-width="2.5"/><text x="345" y="134" font-size="17" fill="#FFFFFF">?</text><text x="345" y="192" font-size="13" fill="#2B3A55">site inconnu</text><text x="190" y="222" font-size="13" fill="#94A3B8">le cadenas protège le trajet,</text><text x="190" y="240" font-size="13" fill="#94A3B8">pas l’honnêteté du site</text></g></svg>