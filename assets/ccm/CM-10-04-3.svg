<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Le capital passe de 1 000 à 950 euros ; les intérêts ne sont pas retirés du capital</title><style>.sl{animation:s 3s ease-in-out infinite}@keyframes s{0%,30%{transform:translateY(0);opacity:1}80%,100%{transform:translateY(40px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><text x="30" y="40" font-size="14" fill="#2B3A55" text-anchor="start">capital avant : 1 000 €</text><rect x="30" y="50" width="340" height="32" rx="4" fill="#E2E8F0" stroke="#2B3A55" stroke-width="2"/><text x="30" y="130" font-size="14" fill="#2B3A55" text-anchor="start">capital après : 950 €</text><rect x="30" y="140" width="323" height="32" rx="4" fill="#E2E8F0" stroke="#2B3A55" stroke-width="2"/><g class="sl"><rect x="353" y="140" width="17" height="32" rx="3" fill="#3B82F6" stroke="#3B82F6" stroke-width="2"/></g><text x="362" y="200" font-size="14" fill="#3B82F6">− 50 €</text><line x1="353" y1="86" x2="353" y2="136" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/><rect x="30" y="210" width="200" height="32" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/><text x="130" y="231" font-size="13" fill="#F59E0B">intérêts 10 € : à part</text><text x="306" y="236" font-size="14" fill="#2B3A55">reste dû</text></g></svg>