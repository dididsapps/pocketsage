<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Compression d’environ 5 cm, sans dépasser 6 cm, puis retour complet ; rythme 100 à 120 par minute</title><style>.h{animation:pr .55s ease-in-out infinite}@keyframes pr{0%,100%{transform:translateY(0)}45%{transform:translateY(20px)}}.m{transform-origin:345px 184px;animation:mt 1.1s ease-in-out infinite}@keyframes mt{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><path d="M40 120Q130 100 220 120V210H40Z" stroke="#2B3A55" stroke-width="3" fill="#E2E8F0"/><text x="130" y="180" font-size="13" fill="#94A3B8">thorax</text><g class="h"><rect x="108" y="74" width="44" height="36" rx="8" fill="#06B6D4" stroke="#2B3A55" stroke-width="3"/><path d="M130 44V72" stroke="#2B3A55" stroke-width="3" fill="none"/></g><path d="M236 108V128M230 108H242M230 128H242" stroke="#10B981" stroke-width="3" fill="none"/><text x="246" y="122" font-size="13" fill="#10B981" text-anchor="start">≈ 5 cm</text><path d="M224 132H244" stroke="#EF4444" stroke-width="3" fill="none" stroke-dasharray="4 4"/><text x="246" y="148" font-size="13" fill="#EF4444" text-anchor="start">max 6 cm</text><text x="130" y="236" font-size="13" fill="#2B3A55">appuyer puis relâcher</text><path d="M320 200L345 70L370 200Z" stroke="#2B3A55" stroke-width="3" fill="#FFFFFF"/><path d="M345 184V90" stroke="#F59E0B" stroke-width="4" fill="none" class="m"/><text x="345" y="222" font-size="13" fill="#2B3A55">100–120 / min</text></g></svg>