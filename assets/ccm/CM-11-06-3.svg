<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Exemple fictif : impôt final 900 €, déjà payé 800 €, reste 100 €</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><text x="200" y="26" font-size="14" fill="#94A3B8">exemple fictif</text><text x="30" y="60" font-size="13" fill="#2B3A55" text-anchor="start">impôt final</text><rect x="30" y="68" width="270" height="40" rx="6" fill="#8B5CF6" stroke="#2B3A55" stroke-width="3"/><text x="165" y="94" font-size="15" fill="#FFFFFF">900 €</text><text x="30" y="136" font-size="13" fill="#10B981" text-anchor="start">déjà payé (conservé)</text><rect x="30" y="144" width="240" height="40" rx="6" fill="#10B981" stroke="#2B3A55" stroke-width="3"/><text x="150" y="170" font-size="15" fill="#FFFFFF">800 €</text><rect x="270" y="144" width="30" height="40" rx="6" fill="#F97316" stroke="#2B3A55" stroke-width="3"/><path d="M285 190V214" stroke="#F97316" stroke-width="2" fill="none"/><text x="285" y="232" font-size="15" fill="#F97316">reste 100 €</text><path d="M300 64V190" stroke="#94A3B8" stroke-width="2" fill="none" stroke-dasharray="4 4"/></g></svg>