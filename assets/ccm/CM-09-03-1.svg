<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Un billet de 20 euros déposé devient une écriture de 20 euros sur le compte</title><style>.bil{animation:b 4s infinite}.ecr{animation:e 4s infinite}@keyframes b{0%,30%{opacity:1}50%,90%{opacity:.1}100%{opacity:1}}@keyframes e{0%,30%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><path d="M30 170q10 -40 40 -40h30q10 0 10 10t-10 10h-16" stroke="#2B3A55" stroke-width="3" fill="#FFFFFF"/><g class="bil"><rect x="48" y="92" width="80" height="42" rx="4" fill="#D1FAE5" stroke="#10B981" stroke-width="3"/><text x="88" y="119" font-size="15" fill="#10B981">20 €</text></g><text x="80" y="206" font-size="15" fill="#2B3A55">billet</text><g><line x1="150" y1="120" x2="204" y2="120" stroke="#3B82F6" stroke-width="4"/><polygon points="214.0,120.0 204.0,126.0 204.0,114.0" fill="#3B82F6" stroke="#3B82F6" stroke-width="2"/></g><rect x="230" y="64" width="146" height="116" rx="10" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><text x="303" y="88" font-size="15" fill="#2B3A55">compte</text><line x1="244" y1="100" x2="362" y2="100" stroke="#94A3B8" stroke-width="2"/><g class="ecr"><text x="303" y="134" font-size="16" fill="#3B82F6">+ 20 €</text></g><line x1="244" y1="152" x2="330" y2="152" stroke="#94A3B8" stroke-width="2"/><text x="303" y="206" font-size="15" fill="#2B3A55">écriture</text><text x="200" y="244" font-size="14" fill="#94A3B8">même somme, autre forme</text></g></svg>