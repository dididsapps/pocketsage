<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Une carte montre trois chemins ; la personne qui écoute choisit elle-même</title><style>.pt{animation:pt 3s ease-in-out infinite}@keyframes pt{50%{transform:translate(-4px,-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="70" y="40" width="260" height="170" rx="10" fill="#F0FDF4" stroke="#2B3A55" stroke-width="3"/><path d="M200 196V150M200 150Q140 120 110 70M200 150V70M200 150Q260 120 290 70" fill="none" stroke="#94A3B8" stroke-width="8"/><circle cx="200" cy="196" r="7" fill="#2B3A55"/><circle cx="110" cy="64" r="15" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><text x="110" y="69" font-size="14" fill="#2B3A55">A</text><circle cx="200" cy="64" r="15" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><text x="200" y="69" font-size="14" fill="#2B3A55">B</text><circle cx="290" cy="64" r="15" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><text x="290" y="69" font-size="14" fill="#2B3A55">C</text><path d="M0 170H52" stroke="#3B82F6" stroke-width="22"/><rect x="50" y="152" width="34" height="36" rx="12" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><path d="M60 156V140" stroke="#2B3A55" stroke-width="3"/><text x="40" y="212" font-size="13" fill="#2B3A55" text-anchor="start">ton explication</text><g class="pt"><path d="M400 120H352" stroke="#8B5CF6" stroke-width="22"/><rect x="318" y="104" width="36" height="32" rx="12" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><path d="M322 112L300 88" stroke="#2B3A55" stroke-width="9"/><path d="M322 112L300 88" stroke="#FFFFFF" stroke-width="3"/></g><text x="360" y="160" font-size="13" fill="#2B3A55">son choix</text><text x="200" y="30" font-size="14" fill="#2B3A55">les chemins possibles</text></g></svg>