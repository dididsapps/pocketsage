<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Exemple fictif : 1 600 € × 5 % = 80 € ; 1 550 € − 80 € = 1 470 € versés</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><text x="200" y="26" font-size="14" fill="#94A3B8">exemple fictif</text><text x="12" y="56" font-size="13" fill="#8B5CF6" text-anchor="start">base fiscale</text><rect x="12" y="66" width="86" height="44" rx="8" fill="#8B5CF6" stroke="#2B3A55" stroke-width="3"/><text x="55" y="94" font-size="15" fill="#FFFFFF">1 600 €</text><text x="111" y="95" font-size="20" fill="#2B3A55">×</text><rect x="124" y="66" width="60" height="44" rx="8" fill="#8B5CF6" stroke="#2B3A55" stroke-width="3"/><text x="154" y="94" font-size="15" fill="#FFFFFF">5 %</text><text x="197" y="95" font-size="20" fill="#2B3A55">=</text><rect x="210" y="66" width="120" height="44" rx="8" fill="#EF4444" stroke="#2B3A55" stroke-width="3"/><text x="270" y="94" font-size="15" fill="#FFFFFF">80 € d’impôt</text><text x="12" y="152" font-size="13" fill="#10B981" text-anchor="start">montant payable</text><rect x="12" y="162" width="86" height="44" rx="8" fill="#10B981" stroke="#2B3A55" stroke-width="3"/><text x="55" y="190" font-size="15" fill="#FFFFFF">1 550 €</text><text x="111" y="191" font-size="20" fill="#2B3A55">−</text><rect x="124" y="162" width="60" height="44" rx="8" fill="#EF4444" stroke="#2B3A55" stroke-width="3"/><text x="154" y="190" font-size="15" fill="#FFFFFF">80 €</text><text x="197" y="191" font-size="20" fill="#2B3A55">=</text><rect x="210" y="162" width="150" height="44" rx="8" fill="#10B981" stroke="#2B3A55" stroke-width="3"/><text x="285" y="190" font-size="15" fill="#FFFFFF">1 470 € versés</text><path d="M270 114V156" stroke="#EF4444" stroke-width="2" fill="none" stroke-dasharray="3 4"/></g></svg>