<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Chaleur du bol chaud vers l’air plus froid, températures qui se rapprochent</title><style>.tb{transform-box:fill-box;transform-origin:50% 100%;animation:tb 4s ease-in-out infinite alternate}@keyframes tb{from{transform:scaleY(1)}to{transform:scaleY(.62)}}.ta{transform-box:fill-box;transform-origin:50% 100%;animation:ta 4s ease-in-out infinite alternate}@keyframes ta{from{transform:scaleY(1)}to{transform:scaleY(1.35)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="96" y="24" width="208" height="200" rx="18" fill="#06B6D4" fill-opacity=".1"/><text x="200" y="44" font-size="13" fill="#06B6D4">air plus froid</text><path d="M180 92Q174 82 180 72M200 92Q194 82 200 72M220 92Q214 82 220 72" stroke="#94A3B8" stroke-width="2" fill="none"/><path d="M145 104H255A55 48 0 0 1 145 104Z" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><path d="M150 112H250" stroke="#EF4444" stroke-width="5"/><text x="200" y="138" font-size="13" fill="#EF4444">bol chaud</text><g><path d="M140 118L115.7 104.3" stroke="#EF4444" stroke-width="3" fill="none"/><polygon points="108,100 120.6,100.1 114.6,110.7" fill="#EF4444"/></g><g><path d="M260 118L284.3 104.3" stroke="#EF4444" stroke-width="3" fill="none"/><polygon points="292,100 285.4,110.7 279.4,100.1" fill="#EF4444"/></g><g><path d="M170 160L145.6 189.2" stroke="#EF4444" stroke-width="3" fill="none"/><polygon points="140,196 142.4,183.7 151.7,191.4" fill="#EF4444"/></g><g><path d="M230 160L254.4 189.2" stroke="#EF4444" stroke-width="3" fill="none"/><polygon points="260,196 248.3,191.4 257.6,183.7" fill="#EF4444"/></g><rect x="43" y="80" width="14" height="120" rx="7" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><circle cx="50" cy="200" r="11" fill="#EF4444" stroke="#2B3A55" stroke-width="3"/><rect class="tb" x="47" y="104" width="6" height="96" rx="3" fill="#EF4444"/><text x="50" y="238" font-size="13" fill="#2B3A55">bol</text><rect x="343" y="80" width="14" height="120" rx="7" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><circle cx="350" cy="200" r="11" fill="#06B6D4" stroke="#2B3A55" stroke-width="3"/><rect class="ta" x="347" y="170" width="6" height="30" rx="3" fill="#06B6D4"/><text x="350" y="238" font-size="13" fill="#2B3A55">air</text><text x="200" y="246" font-size="13" fill="#2B3A55">les écarts se réduisent peu à peu</text></g></svg>