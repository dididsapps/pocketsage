<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Le plateau fait passer le plat dans différentes zones, des écarts restent</title><style>.rot{animation:rot 4s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="30" width="200" height="200" rx="12" fill="#FFFFFF" stroke="#2B3A55" stroke-width="4"/><ellipse cx="80" cy="70" rx="30" ry="20" fill="#EF4444" fill-opacity="0.5"/><ellipse cx="170" cy="90" rx="34" ry="24" fill="#F59E0B" fill-opacity="0.5"/><ellipse cx="110" cy="150" rx="26" ry="30" fill="#F59E0B" fill-opacity="0.5"/><ellipse cx="185" cy="180" rx="30" ry="22" fill="#EF4444" fill-opacity="0.5"/><ellipse cx="70" cy="200" rx="22" ry="14" fill="#F59E0B" fill-opacity="0.5"/><ellipse cx="150" cy="55" rx="18" ry="12" fill="#EF4444" fill-opacity="0.4"/><g transform="translate(130 130)"><g class="rot"><circle r="70" fill="#FFFFFF" fill-opacity=".35" stroke="#2B3A55" stroke-width="3"/><path d="M-40 -20Q-10 -40 30 -25Q45 10 20 35Q-20 45 -40 20Z" fill="#F59E0B" fill-opacity=".45"/><path d="M-40 -20Q-30 0 -40 20Q-20 10 -10 -15Z" fill="#EF4444" fill-opacity=".45"/><circle cx="0" cy="-60" r="7" fill="#3B82F6"/></g></g><path d="M224 60A105 105 0 0 1 238 110" stroke="#2B3A55" stroke-width="3" fill="none"/><polygon points="240,124 231.4,113.3 244.4,111" fill="#2B3A55"/><text x="130" y="22" font-size="13" fill="#2B3A55">zones fixes, plat qui tourne</text><circle cx="262" cy="160" r="7" fill="#3B82F6"/><text x="276" y="165" font-size="13" fill="#2B3A55" text-anchor="start">repère</text><text x="255" y="215" font-size="13" fill="#94A3B8" text-anchor="start">des écarts</text><text x="255" y="233" font-size="13" fill="#94A3B8" text-anchor="start">peuvent rester</text></g></svg>