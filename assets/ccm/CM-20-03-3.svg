<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>La vapeur d’eau est invisible, le brouillard est fait de gouttelettes visibles</title><style>.dr{animation:dr 4s ease-in-out infinite alternate}@keyframes dr{to{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="20" width="180" height="186" rx="14" fill="#94A3B8" fill-opacity=".05" stroke="#94A3B8" stroke-width="2.5"/><rect x="206" y="20" width="180" height="186" rx="14" fill="#94A3B8" fill-opacity=".05" stroke="#94A3B8" stroke-width="2.5"/><text x="104" y="44" font-size="14" fill="#2B3A55">air avec vapeur</text><text x="296" y="44" font-size="14" fill="#2B3A55">brouillard blanc</text><g transform="translate(96 120)"><path d="M33 33L45 45" stroke="#2B3A55" stroke-width="7"/><circle r="46" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/></g><g class="dr"><circle cx="76" cy="96" r="4.5" fill="#3B82F6"/><circle cx="110" cy="104" r="4.5" fill="#3B82F6"/><circle cx="86" cy="130" r="4.5" fill="#3B82F6"/><circle cx="118" cy="142" r="4.5" fill="#3B82F6"/><circle cx="98" cy="160" r="4.5" fill="#3B82F6"/></g><text x="104" y="232" font-size="15" fill="#2B3A55">gaz : invisible</text><g fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"><circle cx="240" cy="90" r="9"/><circle cx="270" cy="110" r="7"/><circle cx="300" cy="80" r="10"/><circle cx="330" cy="112" r="8"/><circle cx="356" cy="88" r="7"/><circle cx="256" cy="146" r="8"/><circle cx="290" cy="140" r="10"/><circle cx="324" cy="160" r="7"/><circle cx="352" cy="140" r="9"/><circle cx="270" cy="180" r="7"/><circle cx="310" cy="186" r="8"/></g><text x="296" y="232" font-size="15" fill="#2B3A55">gouttelettes : visibles</text></g></svg>