<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Un emballage à plusieurs couches : une partie récupérée, une partie non</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="70" width="100" height="16" rx="2" fill="#3B82F6" stroke="#2B3A55" stroke-width="2.5"/><rect x="30" y="86" width="100" height="16" rx="2" fill="#94A3B8" stroke="#2B3A55" stroke-width="2.5"/><rect x="30" y="102" width="100" height="16" rx="2" fill="#8B5CF6" stroke="#2B3A55" stroke-width="2.5"/><text x="80" y="50" font-size="13" fill="#2B3A55">plusieurs couches</text><text x="80" y="144" font-size="13" fill="#2B3A55">emballage</text><path d="M136 96 L165 96" stroke="#2B3A55" stroke-width="3" fill="none"/><polygon points="176,96 165,103 165,89" fill="#2B3A55"/><rect x="180" y="72" width="60" height="48" rx="10" fill="#E2E8F0" stroke="#2B3A55" stroke-width="3"/><text x="210" y="100" font-size="13" fill="#2B3A55">tri</text><path d="M244 86 L281.3 56.8" stroke="#10B981" stroke-width="3" fill="none"/><polygon points="290,50 285.7,62.3 277,51.3" fill="#10B981"/><path d="M244 108 L283.4 161.2" stroke="#94A3B8" stroke-width="3" fill="none"/><polygon points="290,170 277.8,165.3 289.1,157" fill="#94A3B8"/><rect x="300" y="36" width="18" height="18" rx="2" fill="#3B82F6" stroke="#2B3A55" stroke-width="2"/><text x="350" y="50" font-size="13" fill="#2B3A55">récupéré</text><text x="340" y="76" font-size="13" fill="#94A3B8">en partie</text><rect x="300" y="150" width="60" height="40" rx="8" fill="#94A3B8" stroke="#2B3A55" stroke-width="3"/><text x="330" y="210" font-size="13" fill="#2B3A55">non récupéré</text><text x="200" y="245" font-size="13" fill="#94A3B8">aucune garantie de tout recycler</text></g></svg>