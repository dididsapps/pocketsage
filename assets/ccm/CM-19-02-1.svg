<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>La partie immergée de la coque déplace un volume d’eau</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BFDBFE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#3B82F6" stroke-width="3"/></pattern></defs><path d="M20 90L36 230H224L240 90" fill="none" stroke="#2B3A55" stroke-width="4"/><path d="M24 130L34 226H226L236 130Z" fill="#3B82F6" opacity=".2"/><line x1="24" y1="130" x2="236" y2="130" stroke="#3B82F6" stroke-width="3"/><g transform="translate(130 138)"><path d="M-50 -26H50L38 14Q0 28 -38 14Z" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><path d="M-44.5 -8H44.5L38 14Q0 28 -38 14Z" fill="url(#h)" stroke="#2B3A55" stroke-width="2"/></g><text x="130" y="70" font-size="14" fill="#2B3A55">coque (vue en coupe)</text><line x1="130" y1="78" x2="130" y2="97" stroke="#2B3A55" stroke-width="2"/><polygon points="130,104 125.6,96 134.4,96" fill="#2B3A55"/><line x1="250" y1="150" x2="271" y2="150" stroke="#2B3A55" stroke-width="3"/><polygon points="282,150 270,156.6 270,143.4" fill="#2B3A55"/><g transform="translate(330 140)"><path d="M-44.5 -8H44.5L38 14Q0 28 -38 14Z" fill="url(#h)" stroke="#2B3A55" stroke-width="3"/></g><text x="330" y="196" font-size="15" fill="#2B3A55">volume</text><text x="330" y="214" font-size="15" fill="#2B3A55">déplacé</text><text x="330" y="110" font-size="13" fill="#94A3B8">même forme</text></g></svg>