<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Batterie : polarité fixe, tension qui baisse un peu à la décharge</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="60" width="70" height="130" rx="8" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><rect x="60" y="48" width="30" height="12" rx="3" fill="#94A3B8" stroke="#2B3A55" stroke-width="3"/><text x="75" y="100" font-size="24" fill="#EF4444">+</text><text x="75" y="165" font-size="24" fill="#2B3A55">−</text><line x1="40" y1="125" x2="110" y2="125" stroke="#E2E8F0" stroke-width="2"/><text x="75" y="220" font-size="14" fill="#2B3A55">batterie</text><line x1="170" y1="40" x2="170" y2="200" stroke="#94A3B8" stroke-width="2"/><line x1="170" y1="200" x2="385" y2="200" stroke="#94A3B8" stroke-width="2"/><path d="M175 80C260 92 320 100 375 140" stroke="#3B82F6" stroke-width="4" fill="none"/><text x="176" y="30" font-size="13" text-anchor="start" fill="#2B3A55">tension</text><text x="375" y="224" font-size="13" text-anchor="end" fill="#2B3A55">temps</text><text x="280" y="166" font-size="13" fill="#2B3A55">reste positive</text></g></svg>