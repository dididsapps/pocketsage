<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Position latérale de sécurité : couché sur le côté, jambe fléchie, tête soutenue, bouche vers le bas</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><path d="M0 210H400" stroke="#2B3A55" stroke-width="3" fill="none"/><circle cx="70" cy="176" r="18" fill="#E2E8F0" stroke="#2B3A55" stroke-width="3"/><path d="M92 182L210 182" stroke="#94A3B8" stroke-width="28" fill="none"/><path d="M214 190L345 196" stroke="#94A3B8" stroke-width="14" fill="none"/><path d="M214 176L262 144L300 198" stroke="#3B82F6" stroke-width="14" fill="none"/><rect x="54" y="194" width="34" height="12" rx="6" fill="#3B82F6" stroke="#2B3A55" stroke-width="2"/><g><line x1="62" y1="190" x2="62.0" y2="198.0" stroke="#EF4444" stroke-width="2"/><polygon points="62,206 56.0,196.0 68.0,196.0" fill="#EF4444" stroke="#EF4444" stroke-width="2"/></g><text x="280" y="128" font-size="13" fill="#3B82F6">jambe fléchie</text><text x="30" y="140" font-size="13" fill="#2B3A55" text-anchor="start">tête soutenue</text><text x="120" y="236" font-size="13" fill="#EF4444">bouche vers le bas</text><path d="M62 206L90 226" stroke="#EF4444" stroke-width="2" fill="none"/><rect x="348" y="40" width="24" height="40" rx="5" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/><path d="M356 74H364" stroke="#10B981" stroke-width="2" fill="none"/><text x="320" y="30" font-size="13" fill="#10B981">alerter</text><text x="310" y="86" font-size="13" fill="#10B981">surveiller</text><text x="310" y="102" font-size="13" fill="#10B981">la respiration</text><rect x="240" y="233" width="160" height="24" rx="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/><text x="320" y="250" font-size="12" fill="#8B5CF6">à pratiquer en formation</text></g></svg>