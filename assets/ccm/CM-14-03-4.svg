<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Position latérale de sécurité : couché sur le côté, jambe fléchie, tête soutenue, bouche vers le bas</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="60" width="300" height="170" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 5"/><text x="38" y="80" font-size="12" fill="#94A3B8" text-anchor="start">vue de dessus</text><circle cx="72" cy="140" r="20" fill="#E2E8F0" stroke="#2B3A55" stroke-width="3"/><path d="M94 140L200 140" stroke="#94A3B8" stroke-width="30" fill="none"/><path d="M110 152L96 168L80 160" stroke="#94A3B8" stroke-width="10" fill="none"/><path d="M204 132L300 128" stroke="#94A3B8" stroke-width="14" fill="none"/><path d="M204 150L250 196L292 182" stroke="#3B82F6" stroke-width="14" fill="none"/><text x="262" y="218" font-size="13" fill="#3B82F6">jambe fléchie</text><text x="72" y="104" font-size="13" fill="#2B3A55">tête soutenue</text><path d="M58 154L50 170" stroke="#EF4444" stroke-width="2" fill="none"/><polygon points="47,177 44,166 54,168" fill="#EF4444"/><text x="70" y="196" font-size="13" fill="#EF4444">bouche vers le sol</text><text x="160" y="118" font-size="12" fill="#64748B">couché sur le côté</text><rect x="348" y="40" width="24" height="40" rx="5" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/><path d="M356 74H364" stroke="#10B981" stroke-width="2" fill="none"/><text x="360" y="30" font-size="13" fill="#10B981">alerter</text><text x="342" y="100" font-size="13" fill="#10B981">surveiller</text><text x="342" y="116" font-size="13" fill="#10B981">la respiration</text><rect x="240" y="233" width="160" height="24" rx="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/><text x="320" y="250" font-size="12" fill="#8B5CF6">à pratiquer en formation</text></g></svg>