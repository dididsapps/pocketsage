<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Recette fictive de 100 g dont 8 g de fraises</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><text x="200" y="40" font-size="15" fill="#2B3A55">recette fictive : 100 g</text><rect x="40" y="84" width="25.6" height="50" fill="#EF4444"/><rect x="65.6" y="84" width="294.4" height="50" fill="#E2E8F0"/><rect x="40" y="84" width="320" height="50" rx="4" fill="none" stroke="#2B3A55" stroke-width="3"/><line x1="65.6" y1="84" x2="65.6" y2="134" stroke="#2B3A55" stroke-width="2"/><line x1="52.8" y1="140" x2="52.8" y2="170" stroke="#2B3A55" stroke-width="2"/><text x="40" y="190" font-size="14" fill="#2B3A55" text-anchor="start">fraises : 8 g</text><text x="220" y="115" font-size="14" fill="#2B3A55">autres ingrédients : 92 g</text><line x1="40" y1="222" x2="360" y2="222" stroke="#94A3B8" stroke-width="2"/><line x1="40" y1="216" x2="40" y2="228" stroke="#94A3B8" stroke-width="2"/><line x1="360" y1="216" x2="360" y2="228" stroke="#94A3B8" stroke-width="2"/><text x="200" y="246" font-size="13" fill="#94A3B8">8 % = 8 g pour 100 g</text></g></svg>