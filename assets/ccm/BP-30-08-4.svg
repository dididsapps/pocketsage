<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Deux cases après l'entretien, appui et point à travailler ; le résultat de sélection dans un cadre distinct</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><text x="130" y="34" font-size="14" fill="#2B3A55">après l’entretien</text><rect x="14" y="50" width="112" height="150" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/><path d="M70 82l7 14 15 2-11 11 3 15-14-7-14 7 3-15-11-11 15-2z" fill="#10B981" fill-opacity=".3" stroke="#10B981" stroke-width="2.5"/><text x="70" y="160" font-size="14" fill="#10B981">appui à</text><text x="70" y="178" font-size="14" fill="#10B981">conserver</text><rect x="136" y="50" width="112" height="150" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3"/><path d="M192 130V88M178 102L192 88L206 102" stroke="#F59E0B" stroke-width="4" fill="none"/><text x="192" y="160" font-size="14" fill="#F59E0B">point à</text><text x="192" y="178" font-size="14" fill="#F59E0B">travailler</text><rect x="272" y="50" width="116" height="150" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 6"/><g transform="translate(330 110)"><rect x="-26" y="-18" width="52" height="36" rx="4" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><path d="M-26 -16L0 4L26 -16" stroke="#2B3A55" stroke-width="2.5" fill="none"/></g><text x="330" y="160" font-size="14" fill="#94A3B8">résultat de</text><text x="330" y="178" font-size="14" fill="#94A3B8">sélection</text><text x="330" y="222" font-size="13" fill="#94A3B8">pas une note</text><text x="330" y="238" font-size="13" fill="#94A3B8">sur toi</text></g></svg>