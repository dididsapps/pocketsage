<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>L’idée centrale mène à une petite action possible, ou à aucune action pour maintenant, au même niveau</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="130" y="20" width="140" height="56" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="4"/><text x="200" y="54" font-size="15" fill="#2B3A55">idée centrale</text><g><line x1="170" y1="80" x2="110" y2="124" stroke="#2B3A55" stroke-width="3"/><path d="M114.7 114.0L110 124L120.9 122.5" fill="none" stroke="#2B3A55" stroke-width="3"/></g><g><line x1="230" y1="80" x2="290" y2="124" stroke="#2B3A55" stroke-width="3"/><path d="M279.1 122.5L290 124L285.3 114.0" fill="none" stroke="#2B3A55" stroke-width="3"/></g><rect x="30" y="130" width="160" height="100" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/><text x="110" y="156" font-size="14" fill="#10B981">petite action</text><path d="M88 176H132L126 214H94Z" fill="#E2E8F0" stroke="#2B3A55" stroke-width="3"/><rect x="84" y="170" width="52" height="10" rx="3" fill="#F59E0B" stroke="#2B3A55" stroke-width="2"/><text x="110" y="250" font-size="13" fill="#2B3A55">choisir une boîte</text><rect x="210" y="130" width="160" height="100" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/><text x="290" y="168" font-size="14" fill="#94A3B8">aucune action</text><text x="290" y="188" font-size="14" fill="#94A3B8">pour maintenant</text><text x="290" y="250" font-size="13" fill="#94A3B8">même niveau</text></g></svg>