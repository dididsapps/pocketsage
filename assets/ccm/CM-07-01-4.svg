<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Vitesse constante : force motrice équilibrée par les résistances</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><text x="200" y="30" font-size="15" fill="#2B3A55">vitesse constante sur route plane</text><line x1="20" y1="180" x2="380" y2="180" stroke="#94A3B8" stroke-width="4"/><g transform="translate(140 178) scale(1.0)"><path d="M2 -14V-36Q2 -40 6 -40H30L45 -58H84L100 -40H112Q120 -40 120 -32V-14Z" fill="#3B82F6" stroke="#2B3A55" stroke-width="3"/><path d="M37 -40L48 -53H62V-40ZM67 -40V-53H81L92 -40Z" fill="#FFFFFF" stroke="#2B3A55" stroke-width="2"/><circle cx="25" cy="-12" r="12" fill="#2B3A55"/><circle cx="25" cy="-12" r="4" fill="#E2E8F0"/><circle cx="95" cy="-12" r="12" fill="#2B3A55"/><circle cx="95" cy="-12" r="4" fill="#E2E8F0"/></g><line x1="262" y1="145" x2="326" y2="145" stroke="#10B981" stroke-width="5"/><polygon points="342,145 325,155.5 325,134.5" fill="#10B981" stroke="#10B981" stroke-width="2"/><text x="302" y="128" font-size="13" fill="#2B3A55">force motrice</text><line x1="138" y1="125" x2="104" y2="125" stroke="#EF4444" stroke-width="5"/><polygon points="88,125 105,114.5 105,135.5" fill="#EF4444" stroke="#EF4444" stroke-width="2"/><text x="72" y="130" font-size="13" text-anchor="end" fill="#2B3A55">air</text><line x1="138" y1="165" x2="124" y2="165" stroke="#EF4444" stroke-width="5"/><polygon points="108,165 125,154.5 125,175.5" fill="#EF4444" stroke="#EF4444" stroke-width="2"/><text x="96" y="170" font-size="13" text-anchor="end" fill="#2B3A55">roulement</text><text x="200" y="222" font-size="14" fill="#2B3A55">motrice = air + roulement</text><text x="200" y="242" font-size="13" fill="#10B981">bilan horizontal équilibré</text></g></svg>