<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Équilibre production / consommation sur le réseau</title><style>.b{transform-origin:200px 90px;animation:b 4s ease-in-out infinite}@keyframes b{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}50%{transform:rotate(0)}75%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><g class="b"><line x1="60" y1="90" x2="340" y2="90" stroke="#2B3A55" stroke-width="5"/><line x1="80" y1="90" x2="80" y2="120" stroke="#2B3A55" stroke-width="2"/><line x1="320" y1="90" x2="320" y2="120" stroke="#2B3A55" stroke-width="2"/><rect x="10" y="120" width="140" height="64" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/><text x="80" y="140" font-size="13" fill="#2B3A55">production</text><text x="80" y="157" font-size="13" fill="#2B3A55">+ déstockage</text><text x="80" y="174" font-size="13" fill="#2B3A55">+ importations</text><rect x="240" y="120" width="150" height="82" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="3"/><text x="315" y="140" font-size="13" fill="#2B3A55">usages</text><text x="315" y="157" font-size="13" fill="#2B3A55">+ stockage</text><text x="315" y="174" font-size="13" fill="#2B3A55">+ exportations</text><text x="315" y="191" font-size="13" fill="#2B3A55">+ pertes</text></g><path d="M200 92L180 240H220Z" stroke="#E2E8F0" stroke-width="3" fill="#E2E8F0"/><circle cx="200" cy="90" r="7" fill="#2B3A55"/><text x="200" y="36" font-size="14" fill="#2B3A55">équilibre presque instantané</text></g></svg>