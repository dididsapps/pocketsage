<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Sur 1 000 euros dus, un paiement de 60 euros : 10 euros d’intérêts, 50 euros de capital</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><text x="30" y="40" font-size="15" fill="#2B3A55" text-anchor="start">encore dû : 1 000 €</text><rect x="30" y="50" width="340" height="30" rx="4" fill="#E2E8F0" stroke="#2B3A55" stroke-width="2"/><text x="30" y="128" font-size="15" fill="#2B3A55" text-anchor="start">paiement 60 €</text><rect x="30" y="140" width="60" height="40" rx="4" fill="#F59E0B" stroke="#F59E0B" stroke-width="2"/><rect x="90" y="140" width="280" height="40" rx="4" fill="#3B82F6" stroke="#3B82F6" stroke-width="2"/><text x="60" y="166" font-size="14" fill="#FFFFFF">10 €</text><text x="230" y="166" font-size="15" fill="#FFFFFF">50 €</text><text x="60" y="206" font-size="14" fill="#F59E0B">intérêts</text><text x="60" y="224" font-size="13" fill="#94A3B8">(1 %)</text><text x="230" y="206" font-size="14" fill="#3B82F6">capital remboursé</text><line x1="30" y1="90" x2="30" y2="132" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/></g></svg>