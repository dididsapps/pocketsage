<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Le stylo et la question d’usage : besoin présent, ou aucun besoin et donc rien à proposer</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><g><path d="M192 50L200 64L208 50" fill="#EFF6FF" stroke="#3B82F6" stroke-width="3"/><rect x="118" y="12" width="164" height="40" rx="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="3"/><path d="M192 50L200 64L208 50" fill="#EFF6FF"/></g><text x="200" y="38" font-size="14" fill="#2B3A55">besoin d’écrire ?</text><g transform="translate(200 108) rotate(90)"><rect x="-8" y="-38" width="16" height="60" rx="4" fill="#3B82F6" stroke="#2B3A55" stroke-width="3"/><path d="M-8 22L0 36L8 22Z" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/></g><g><line x1="170" y1="128" x2="110" y2="170" stroke="#2B3A55" stroke-width="3"/><path d="M114.9 160.1L110 170L120.9 168.8" fill="none" stroke="#2B3A55" stroke-width="3"/></g><g><line x1="230" y1="128" x2="290" y2="170" stroke="#2B3A55" stroke-width="3"/><path d="M279.1 168.8L290 170L285.1 160.1" fill="none" stroke="#2B3A55" stroke-width="3"/></g><rect x="30" y="174" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/><text x="105" y="200" font-size="14" fill="#10B981">besoin présent</text><text x="105" y="222" font-size="13" fill="#2B3A55">on peut proposer</text><rect x="220" y="174" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/><text x="295" y="200" font-size="14" fill="#94A3B8">aucun besoin</text><text x="295" y="222" font-size="13" fill="#2B3A55">rien à proposer</text></g></svg>