<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Étiquette fictive : espèce, capturé ou élevé, zone</title><style>.lp{animation:lp 6s ease-in-out infinite}@keyframes lp{0%,25%{transform:translate(0,0)}33%,58%{transform:translate(0,52px)}66%,92%{transform:translate(0,104px)}100%{transform:translate(0,0)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="24" width="240" height="210" rx="12" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><text x="160" y="50" font-size="13" fill="#94A3B8">étiquette (exemple)</text><text x="60" y="88" font-size="14" fill="#2B3A55" text-anchor="start">espèce</text><path d="M60 104h150" stroke="#E2E8F0" stroke-width="5"/><text x="60" y="140" font-size="14" fill="#2B3A55" text-anchor="start">capturé ou élevé</text><path d="M60 156h150" stroke="#E2E8F0" stroke-width="5"/><text x="60" y="192" font-size="14" fill="#2B3A55" text-anchor="start">zone</text><path d="M60 208h150" stroke="#E2E8F0" stroke-width="5"/><g class="lp"><g transform="translate(320 94) scale(1.4)"><path d="M12 12l12 12" stroke="#2B3A55" stroke-width="6"/><circle r="17" fill="#FFFFFF" fill-opacity=".7" stroke="#2B3A55" stroke-width="3"/></g></g></g></svg>