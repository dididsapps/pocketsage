<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Crédit renouvelable : rembourser reconstitue la réserve, réutiliser recrée la dette</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="70" y="40" width="80" height="160" rx="6" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><rect x="250" y="40" width="80" height="160" rx="6" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><rect x="72" y="120" width="76" height="78" fill="#10B981"><animate attributeName="y" values="120;80;120" dur="6s" repeatCount="indefinite"/><animate attributeName="height" values="78;118;78" dur="6s" repeatCount="indefinite"/></rect><rect x="252" y="120" width="76" height="78" fill="#F59E0B"><animate attributeName="y" values="120;160;120" dur="6s" repeatCount="indefinite"/><animate attributeName="height" values="78;38;78" dur="6s" repeatCount="indefinite"/></rect><text x="110" y="224" font-size="15" fill="#10B981">réserve</text><text x="290" y="224" font-size="15" fill="#F59E0B">dette</text><g><line x1="240" y1="90" x2="169" y2="90" stroke="#3B82F6" stroke-width="3"/><polygon points="160.0,90.0 169.0,84.6 169.0,95.4" fill="#3B82F6" stroke="#3B82F6" stroke-width="2"/></g><text x="200" y="76" font-size="13" fill="#3B82F6">rembourser</text><g><line x1="160" y1="150" x2="231" y2="150" stroke="#F59E0B" stroke-width="3"/><polygon points="240.0,150.0 231.0,155.4 231.0,144.6" fill="#F59E0B" stroke="#F59E0B" stroke-width="2"/></g><text x="200" y="174" font-size="13" fill="#F59E0B">réutiliser</text><text x="200" y="250" font-size="13" fill="#94A3B8">pas un nouveau revenu</text></g></svg>