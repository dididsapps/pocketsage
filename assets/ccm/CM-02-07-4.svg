<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>200 °C est une température cible, 800 W une puissance : grandeurs différentes</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><circle cx="90" cy="110" r="48" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><circle cx="90" cy="110" r="30" fill="#E2E8F0" stroke="#2B3A55" stroke-width="2"/><path d="M90 110L110 90" stroke="#EF4444" stroke-width="4"/><text x="90" y="40" font-size="14" fill="#2B3A55">four</text><text x="90" y="186" font-size="16" fill="#EF4444">200 °C</text><text x="90" y="206" font-size="13" fill="#2B3A55">température</text><text x="90" y="222" font-size="13" fill="#2B3A55">cible</text><circle cx="310" cy="110" r="48" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><circle cx="310" cy="110" r="30" fill="#E2E8F0" stroke="#2B3A55" stroke-width="2"/><path d="M310 110L330 90" stroke="#8B5CF6" stroke-width="4"/><text x="310" y="40" font-size="14" fill="#2B3A55">micro-ondes</text><text x="310" y="186" font-size="16" fill="#8B5CF6">800 W</text><text x="310" y="206" font-size="13" fill="#2B3A55">puissance</text><text x="310" y="222" font-size="13" fill="#2B3A55">de chauffage</text><text x="200" y="128" font-size="48" fill="#EF4444">≠</text><text x="200" y="160" font-size="13" fill="#EF4444">grandeurs</text><text x="200" y="176" font-size="13" fill="#EF4444">différentes</text></g></svg>