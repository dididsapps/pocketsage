<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Marche-arrêt ou puissance variable ; pleine puissance = pas plus rapide</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><text x="24" y="30" font-size="14" text-anchor="start" fill="#2B3A55">marche / arrêt</text><path d="M24 100L375 100" stroke="#94A3B8" stroke-width="2" fill="none"/><polygon points="384,100 373,106.5 373,93.5" fill="#94A3B8"/><path d="M30 100H60V52H110V100H150V52H200V100H240V52H296V100H340" stroke="#F59E0B" stroke-width="4" fill="none"/><text x="24" y="128" font-size="14" text-anchor="start" fill="#2B3A55">puissance variable</text><path d="M24 190L375 190" stroke="#94A3B8" stroke-width="2" fill="none"/><polygon points="384,190 373,196.5 373,183.5" fill="#94A3B8"/><path d="M30 190C60 140 100 140 140 160S210 176 250 150S320 140 350 160" stroke="#F59E0B" stroke-width="4" fill="none"/><text x="380" y="90" font-size="13" text-anchor="end" fill="#2B3A55">temps</text><rect x="24" y="202" width="352" height="52" rx="8" fill="#FFFFFF" stroke="#2B3A55" stroke-width="2"/><text x="200" y="222" font-size="14" fill="#2B3A55">si déjà à pleine puissance :</text><text x="200" y="244" font-size="13" fill="#2B3A55">consigne plus haute ≠ chauffe plus rapide</text></g></svg>