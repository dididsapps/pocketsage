<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Même métal : un bloc plein coule, une coque creuse flotte</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BFDBFE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#3B82F6" stroke-width="3"/></pattern></defs><rect x="0" y="110" width="400" height="150" fill="#3B82F6" opacity=".2"/><line x1="0" y1="110" x2="400" y2="110" stroke="#3B82F6" stroke-width="3"/><line x1="200" y1="30" x2="200" y2="250" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 6"/><text x="100" y="40" font-size="15" fill="#2B3A55">bloc plein</text><text x="300" y="40" font-size="15" fill="#2B3A55">coque creuse</text><rect x="80" y="210" width="40" height="34" rx="4" fill="#94A3B8" stroke="#2B3A55" stroke-width="3"/><line x1="100" y1="140" x2="100" y2="193" stroke="#2B3A55" stroke-width="2"/><polygon points="100,200 95.6,192 104.4,192" fill="#2B3A55"/><text x="130" y="175" font-size="13" fill="#2B3A55" text-anchor="start">coule</text><path d="M234 82H366L346 150Q300 166 254 150Z" fill="url(#h)" stroke="#2B3A55" stroke-width="2"/><path d="M234 82H366L346 150Q300 166 254 150Z" fill="none" stroke="#94A3B8" stroke-width="6"/><path d="M244 90H356L340 144Q300 156 260 144Z" fill="#FFFFFF" opacity=".7"/><text x="300" y="120" font-size="13" fill="#2B3A55">intérieur sec</text><text x="300" y="200" font-size="14" fill="#2B3A55">beaucoup d’eau</text><text x="300" y="218" font-size="14" fill="#2B3A55">déplacée</text><text x="200" y="18" font-size="13" fill="#94A3B8">même quantité de métal</text></g></svg>