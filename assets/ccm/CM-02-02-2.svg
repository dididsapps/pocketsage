<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Zoom : molécules d’eau qui pivotent et ions qui bougent, l’aliment chauffe</title><style>.r{animation:r 2s ease-in-out infinite alternate}@keyframes r{from{transform:rotate(-50deg)}to{transform:rotate(50deg)}}.r2{animation-delay:-1s}.r3{animation-delay:-.5s}.j{animation:j 1s ease-in-out infinite alternate}@keyframes j{to{transform:translate(5px,3px)}}.o{animation:o 4s ease-in-out infinite alternate}@keyframes o{from{opacity:0}to{opacity:.45}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><path d="M30 150H120V184H30Z" fill="#F59E0B" fill-opacity=".3" stroke="#2B3A55" stroke-width="3"/><text x="75" y="206" font-size="13" fill="#2B3A55">aliment</text><circle cx="75" cy="167" r="10" fill="none" stroke="#2B3A55" stroke-width="2"/><path d="M84 160L190 60M84 174L190 220" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 6"/><circle cx="255" cy="130" r="95" fill="#FFFFFF" stroke="#2B3A55" stroke-width="4"/><circle class="o" cx="255" cy="130" r="93" fill="#F59E0B" opacity=".3"/><g transform="translate(215 90)"><g class="r"><circle cx="0" cy="0" r="9" fill="#3B82F6"/><circle cx="-10" cy="8" r="5" fill="#FFFFFF" stroke="#2B3A55" stroke-width="2"/><circle cx="10" cy="8" r="5" fill="#FFFFFF" stroke="#2B3A55" stroke-width="2"/></g></g><g transform="translate(290 85)"><g class="r r2"><circle cx="0" cy="0" r="9" fill="#3B82F6"/><circle cx="-10" cy="8" r="5" fill="#FFFFFF" stroke="#2B3A55" stroke-width="2"/><circle cx="10" cy="8" r="5" fill="#FFFFFF" stroke="#2B3A55" stroke-width="2"/></g></g><g transform="translate(240 145)"><g class="r r3"><circle cx="0" cy="0" r="9" fill="#3B82F6"/><circle cx="-10" cy="8" r="5" fill="#FFFFFF" stroke="#2B3A55" stroke-width="2"/><circle cx="10" cy="8" r="5" fill="#FFFFFF" stroke="#2B3A55" stroke-width="2"/></g></g>