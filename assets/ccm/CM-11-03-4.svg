<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Exemple fictif : 2 000 € brut moins 450 € de retenues donnent 1 550 €</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><text x="200" y="30" font-size="14" fill="#94A3B8">exemple fictif</text><path d="M30 60V52H330V60" stroke="#2B3A55" stroke-width="2" fill="none"/><text x="180" y="46" font-size="15" fill="#2B3A55">2 000 € brut</text><rect x="30" y="66" width="67.5" height="50" rx="4" fill="#F97316" stroke="#2B3A55" stroke-width="3"/><rect x="97.5" y="66" width="232.5" height="50" rx="4" fill="#10B981" stroke="#2B3A55" stroke-width="3"/><text x="63.75" y="97" font-size="14" fill="#FFFFFF">450 €</text><text x="213.75" y="97" font-size="16" fill="#FFFFFF">1 550 €</text><text x="63.75" y="138" font-size="13" fill="#F97316">retenues</text><text x="63.75" y="154" font-size="13" fill="#F97316">salariales</text><text x="213.75" y="140" font-size="13" fill="#10B981">avant impôt sur le revenu</text><rect x="140" y="180" width="230" height="54" rx="8" fill="#E2E8F0" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5 4"/><text x="255" y="203" font-size="13" fill="#3B82F6">cotisations employeur</text><text x="255" y="222" font-size="13" fill="#3B82F6">à côté, non retirées</text></g></svg>