<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Solde sous zéro : une dette envers la banque, pas une réserve</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><line x1="30" y1="130" x2="370" y2="130" stroke="#2B3A55" stroke-width="3"/><text x="22" y="135" font-size="15" fill="#2B3A55" text-anchor="end">0</text><path d="M200 130L250 190H330L350 130Z" fill="#F59E0B" opacity=".35"/><path d="M30 70H120L200 130L250 190H330L350 130" stroke="#3B82F6" stroke-width="4" fill="none"/><text x="75" y="60" font-size="14" fill="#3B82F6">argent inscrit</text><text x="290" y="216" font-size="14" fill="#F59E0B">dette envers</text><text x="290" y="234" font-size="14" fill="#F59E0B">la banque</text><text x="290" y="168" font-size="14" fill="#2B3A55">prêté</text><text x="110" y="186" font-size="14" fill="#94A3B8">sous zéro :</text><text x="110" y="204" font-size="14" fill="#94A3B8">pas une réserve</text></g></svg>