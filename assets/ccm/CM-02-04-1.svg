<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Le frigo prélève la chaleur de l’intérieur et la rejette dans la pièce, grâce à l’électricité</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="150" y="40" width="90" height="180" rx="10" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><rect x="160" y="52" width="64" height="156" rx="6" fill="#06B6D4" fill-opacity=".2"/><path d="M244 60V200" stroke="#94A3B8" stroke-width="3" stroke-dasharray="2 7"/><text x="192" y="232" font-size="13" fill="#94A3B8">frigo de côté</text><text x="192" y="112" font-size="13" fill="#06B6D4">intérieur</text><text x="192" y="128" font-size="13" fill="#06B6D4">froid</text><g><path d="M200 150L251.8 150" stroke="#EF4444" stroke-width="4" fill="none"/><polygon points="262,150 249.2,157 249.2,143" fill="#EF4444"/></g><g><path d="M262 150Q300 150 316.4 105.6" stroke="#EF4444" stroke-width="4" fill="none"/><polygon points="320,96 322.2,110.4 309,105.6" fill="#EF4444"/></g><text x="250" y="180" font-size="13" fill="#94A3B8" text-anchor="start">arrière</text><text x="340" y="70" font-size="14" fill="#2B3A55">pièce</text><text x="340" y="86" font-size="13" fill="#EF4444">chaleur rejetée</text><rect x="34" y="176" width="34" height="26" rx="6" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><path d="M42 176V166M60 176V166" stroke="#2B3A55" stroke-width="3"/><g><path d="M74 189L133.8 189" stroke="#F59E0B" stroke-width="4" fill="none"/><polygon points="144,189 131.2,196 131.2,182" fill="#F59E0B"/></g><text x="60" y="226" font-size="13" fill="#F59E0B">électricité</text></g></svg>