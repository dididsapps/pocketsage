<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Deux piles fermées de même taille : neuve avec beaucoup d’énergie disponible, usée avec peu</title><style>.fl{stroke-dasharray:0 14;animation:fl 3s linear infinite}@keyframes fl{to{stroke-dashoffset:-56}}.da{stroke-dasharray:8 8;animation:da 2s linear infinite}@keyframes da{to{stroke-dashoffset:-32}}.pu{animation:pu 3s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="105" y="64" width="10" height="7" rx="2" fill="#94A3B8" stroke="#2B3A55" stroke-width="2"/><rect x="80" y="70" width="60" height="110" rx="5" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><rect x="165" y="70" width="20" height="110" rx="4" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><rect x="168" y="78" width="14" height="99" rx="2" fill="#10B981" stroke="#10B981" stroke-width="0"/><text x="125" y="215" font-size="15" fill="#2B3A55">neuve</text><rect x="265" y="64" width="10" height="7" rx="2" fill="#94A3B8" stroke="#2B3A55" stroke-width="2"/><rect x="240" y="70" width="60" height="110" rx="5" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><rect x="325" y="70" width="20" height="110" rx="4" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><rect x="328" y="155" width="14" height="22" rx="2" fill="#F59E0B" stroke="#F59E0B" stroke-width="0"/><text x="285" y="215" font-size="15" fill="#2B3A55">usée</text><text x="200" y="30" font-size="14" fill="#94A3B8">énergie disponible</text><line x1="200" y1="50" x2="200" y2="200" stroke="#E2E8F0" stroke-width="3"/></g></svg>