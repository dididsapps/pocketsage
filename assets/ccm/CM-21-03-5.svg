<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Le sang est rouge clair ou rouge sombre ; le bleu n’est qu’un code de dessin</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -40C14 -18 26 -2 26 14C26 30 14 40 0 40C-14 40 -26 30 -26 14C-26 -2 -14 -18 0 -40Z" stroke="#2B3A55" stroke-width="3" fill="#F87171" transform="translate(70 110)"/><path d="M0 -40C14 -18 26 -2 26 14C26 30 14 40 0 40C-14 40 -26 30 -26 14C-26 -2 -14 -18 0 -40Z" stroke="#2B3A55" stroke-width="3" fill="#B91C1C" transform="translate(170 110)"/><text x="70" y="172" font-size="13" fill="#2B3A55">plus clair</text><text x="170" y="172" font-size="13" fill="#2B3A55">plus sombre</text><text x="120" y="210" font-size="15" fill="#B91C1C">toujours rouge</text><rect x="232" y="30" width="156" height="200" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 5"/><text x="310" y="54" font-size="13" fill="#94A3B8">sur un schéma</text><path d="M252 120Q290 90 310 120T370 120" stroke="#3B82F6" stroke-width="12" fill="none"/><text x="310" y="170" font-size="14" fill="#3B82F6">bleu = code</text><text x="310" y="188" font-size="14" fill="#3B82F6">de dessin</text><text x="310" y="212" font-size="12" fill="#94A3B8">pas la vraie couleur</text></g></svg>