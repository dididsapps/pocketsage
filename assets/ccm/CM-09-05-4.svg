<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Solde de 80 euros moins 25 et 20 euros : marge de 35 euros</title><style>.s1{animation:o 4s infinite}.s2{animation:o 4s 1s infinite}@keyframes o{0%,100%{opacity:1}50%{opacity:.55}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="52" font-size="15" fill="#3B82F6" text-anchor="start">solde affiché 80 €</text><rect x="40" y="62" width="320" height="34" rx="4" fill="#3B82F6" stroke="#3B82F6" stroke-width="2"/><g class="s1"><rect x="40" y="120" width="100" height="34" rx="4" fill="#F59E0B" stroke="#F59E0B" stroke-width="2"/><text x="90" y="142" font-size="14" fill="#FFFFFF">− 25 €</text><text x="90" y="174" font-size="13" fill="#2B3A55">paiement</text></g><g class="s2"><rect x="140" y="120" width="80" height="34" rx="4" fill="#F59E0B" stroke="#F59E0B" stroke-width="2" fill-opacity=".75"/><text x="180" y="142" font-size="14" fill="#FFFFFF">− 20 €</text><text x="180" y="174" font-size="13" fill="#2B3A55">facture</text></g><rect x="220" y="120" width="140" height="34" rx="4" fill="#10B981" stroke="#10B981" stroke-width="2"/><text x="290" y="142" font-size="15" fill="#FFFFFF">35 €</text><text x="290" y="174" font-size="14" fill="#10B981">marge</text><line x1="140" y1="100" x2="140" y2="116" stroke="#94A3B8" stroke-width="2"/><line x1="220" y1="100" x2="220" y2="116" stroke="#94A3B8" stroke-width="2"/><text x="200" y="222" font-size="14" fill="#94A3B8">chaque opération</text><text x="200" y="240" font-size="14" fill="#94A3B8">comptée une seule fois</text></g></svg>