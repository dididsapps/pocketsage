<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Le flotteur monte avec l’eau et commande l’arrêt au repère</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="130" y="40" width="200" height="196" rx="8" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><rect x="133" width="194" fill="#3B82F6" opacity=".35"><animate attributeName="y" values="200;100;100" keyTimes="0;.75;1" dur="4s" repeatCount="indefinite"/><animate attributeName="height" values="33;133;133" keyTimes="0;.75;1" dur="4s" repeatCount="indefinite"/></rect><line x1="134" y1="100" x2="326" y2="100" stroke="#10B981" stroke-width="2" stroke-dasharray="6 5"/><text x="340" y="104" font-size="13" fill="#10B981" text-anchor="start">repère</text><path d="M30 64H150" stroke="#94A3B8" stroke-width="8" fill="none"/><rect x="140" y="52" width="28" height="24" rx="4" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><text x="154" y="30" font-size="13" fill="#2B3A55">vanne</text><text x="60" y="52" font-size="13" fill="#2B3A55">arrivée</text><g opacity="1"><g><line x1="154" y1="80" x2="154" y2="113" stroke="#3B82F6" stroke-width="3"/><polygon points="154,120 148,110 160,110" fill="#3B82F6" stroke="#3B82F6" stroke-width="2"/></g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.72;.76;1" dur="4s" repeatCount="indefinite"/></g><circle cx="260" cy="200" r="14" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/><circle cx="260" cy="150" r="14" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/><line x1="168" y1="64" x2="260" stroke="#2B3A55" stroke-width="2" stroke-dasharray="5 5"><animate attributeName="y2" values="200;100;100" keyTimes="0;.75;1" dur="4s" repeatCount="indefinite"/></line><circle cx="260" r="14" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"><animate att