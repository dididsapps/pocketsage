<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Carte illustrative de zones plus ou moins chaudes dans l’enceinte</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="30" width="200" height="200" rx="12" fill="#FFFFFF" stroke="#2B3A55" stroke-width="4"/><ellipse cx="80" cy="70" rx="30" ry="20" fill="#EF4444" fill-opacity="0.5"/><ellipse cx="170" cy="90" rx="34" ry="24" fill="#F59E0B" fill-opacity="0.5"/><ellipse cx="110" cy="150" rx="26" ry="30" fill="#F59E0B" fill-opacity="0.5"/><ellipse cx="185" cy="180" rx="30" ry="22" fill="#EF4444" fill-opacity="0.5"/><ellipse cx="70" cy="200" rx="22" ry="14" fill="#F59E0B" fill-opacity="0.5"/><ellipse cx="150" cy="55" rx="18" ry="12" fill="#EF4444" fill-opacity="0.4"/><circle cx="130" cy="130" r="70" fill="#FFFFFF" fill-opacity=".35" stroke="#2B3A55" stroke-width="3"/><text x="130" y="22" font-size="13" fill="#94A3B8">vue du dessus</text><rect x="250" y="60" width="14" height="14" rx="3" fill="#EF4444" fill-opacity="0.5"/><text x="270" y="72" font-size="13" fill="#2B3A55" text-anchor="start">plus chaud</text><rect x="250" y="90" width="14" height="14" rx="3" fill="#F59E0B" fill-opacity="0.5"/><text x="270" y="102" font-size="13" fill="#2B3A55" text-anchor="start">chaud</text><rect x="250" y="120" width="14" height="14" rx="3" fill="#E2E8F0" fill-opacity="1"/><text x="270" y="132" font-size="13" fill="#2B3A55" text-anchor="start">moins chaud</text><text x="130" y="132" font-size="13" fill="#2B3A55">plat</text><text x="315" y="190" font-size="13" fill="#94A3B8">carte illustrative,</text><text x="315" y="208" font-size="13" fill="#94A3B8">variable selon</text><text x="315" y="226" font-size="13" fill="#94A3B8">appareil et contenu</text></g></svg>