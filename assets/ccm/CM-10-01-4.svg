<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Un petit bouton payer plus tard ouvre un contrat : capital, durée, échéances, coût</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="110" width="100" height="28" rx="14" fill="#3B82F6" stroke="#3B82F6" stroke-width="2"/><text x="70" y="129" font-size="13" fill="#FFFFFF">payer plus tard</text><text x="70" y="160" font-size="13" fill="#94A3B8">petit bouton</text><g><line x1="126" y1="124" x2="183" y2="124" stroke="#2B3A55" stroke-width="3"/><polygon points="192.0,124.0 183.0,129.4 183.0,118.6" fill="#2B3A55" stroke="#2B3A55" stroke-width="2"/></g><text x="160" y="112" font-size="13" fill="#2B3A55">ouvrir</text><rect x="200" y="20" width="180" height="220" rx="10" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><text x="290" y="46" font-size="15" fill="#2B3A55">conditions</text><text x="216" y="82" font-size="14" fill="#2B3A55" text-anchor="start">capital</text><line x1="216" y1="94" x2="364" y2="94" stroke="#94A3B8" stroke-width="2"/><text x="216" y="124" font-size="14" fill="#2B3A55" text-anchor="start">durée</text><line x1="216" y1="136" x2="364" y2="136" stroke="#94A3B8" stroke-width="2"/><text x="216" y="166" font-size="14" fill="#2B3A55" text-anchor="start">échéances</text><line x1="216" y1="178" x2="364" y2="178" stroke="#94A3B8" stroke-width="2"/><text x="216" y="208" font-size="14" fill="#2B3A55" text-anchor="start">coût</text><line x1="216" y1="220" x2="364" y2="220" stroke="#94A3B8" stroke-width="2"/><text x="70" y="220" font-size="14" fill="#10B981">lire avant</text><text x="70" y="238" font-size="14" fill="#10B981">de décider</text></g></svg>