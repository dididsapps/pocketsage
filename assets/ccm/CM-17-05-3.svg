<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Filament : grande branche de chaleur ; LED : plus petite branche de chaleur, pour une lumière comparable</title><style>.fl{stroke-dasharray:0 14;animation:fl 3s linear infinite}@keyframes fl{to{stroke-dashoffset:-56}}.da{stroke-dasharray:8 8;animation:da 2s linear infinite}@keyframes da{to{stroke-dashoffset:-32}}.pu{animation:pu 3s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><path d="M20 118H70" stroke="#F97316" stroke-width="24" fill="none"/><path d="M70 112H170" stroke="#F59E0B" stroke-width="10" fill="none"/><path d="M70 124Q120 124 140 195" stroke="#EF4444" stroke-width="14" fill="none"/><text x="95" y="40" font-size="15" fill="#2B3A55">filament</text><path d="M220 118H270" stroke="#F97316" stroke-width="10" fill="none"/><path d="M270 116H370" stroke="#F59E0B" stroke-width="10" fill="none"/><path d="M270 120Q310 120 325 175" stroke="#EF4444" stroke-width="4" fill="none"/><text x="300" y="40" font-size="15" fill="#2B3A55">LED</text><text x="165" y="96" font-size="13" fill="#2B3A55">lumière</text><text x="365" y="96" font-size="13" fill="#2B3A55">lumière</text><text x="140" y="220" font-size="13" fill="#EF4444">chaleur</text><text x="325" y="200" font-size="13" fill="#EF4444">chaleur</text><line x1="200" y1="30" x2="200" y2="200" stroke="#E2E8F0" stroke-width="3"/><text x="200" y="245" font-size="13" fill="#94A3B8">comparaison sans valeurs</text></g></svg>