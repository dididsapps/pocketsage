<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>L’air va de la pression plus élevée vers la plus basse, comme une bille sur une pente</title><style>.fl{stroke-dasharray:6 8;animation:fl 3s linear infinite}@keyframes fl{to{stroke-dashoffset:-28}}.dr{animation:dr 3s ease-in infinite}@keyframes dr{to{transform:translate(70px,16px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><circle cx="80" cy="96" r="50" fill="#8B5CF6" fill-opacity=".18" stroke="#8B5CF6" stroke-width="3"/><circle cx="320" cy="96" r="50" fill="#8B5CF6" fill-opacity=".05" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="6 6"/><text x="80" y="92" font-size="13" fill="#2B3A55">pression</text><text x="80" y="108" font-size="13" fill="#2B3A55">plus élevée</text><text x="320" y="92" font-size="13" fill="#2B3A55">pression</text><text x="320" y="108" font-size="13" fill="#2B3A55">plus basse</text><g><line x1="136" y1="96" x2="246" y2="96" stroke="#3B82F6" stroke-width="5" class="fl"/><polygon points="262,96 246,106 246,86" fill="#3B82F6"/></g><text x="200" y="82" font-size="15" fill="#2B3A55">vent</text><rect x="20" y="160" width="190" height="92" rx="14" fill="#94A3B8" fill-opacity=".08" stroke="#94A3B8" stroke-width="2.5"/><text x="115" y="180" font-size="13" fill="#2B3A55">comme une bille</text><path d="M36 204L190 240H36z" fill="#E2E8F0" stroke="#2B3A55" stroke-width="3"/><circle cx="80" cy="205" r="9" fill="#F59E0B" stroke="#2B3A55" stroke-width="2.5" class="dr"/><text x="305" y="196" font-size="13" fill="#2B3A55">dessin simplifié :</text><text x="305" y="214" font-size="13" fill="#2B3A55">la rotation de la</text><text x="305" y="232" font-size="13" fill="#2B3A55">Terre compte aussi</text></g></svg>