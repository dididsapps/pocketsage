<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Énergie = puissance × durée : aire du rectangle</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="60" y="50" width="170" height="130" rx="4" fill="#FED7AA" stroke="#F97316" stroke-width="4"/><text x="145" y="120" font-size="16" fill="#2B3A55">énergie</text><text x="145" y="138" font-size="13" fill="#2B3A55">(kWh)</text><g><line x1="60" y1="205" x2="221" y2="205" stroke="#2B3A55" stroke-width="2"/><polygon points="230,205 219,212 219,198" fill="#2B3A55" stroke="#2B3A55" stroke-width="2"/></g><text x="145" y="232" font-size="14" fill="#2B3A55">durée (h)</text><g><line x1="36" y1="180" x2="36" y2="59" stroke="#2B3A55" stroke-width="2"/><polygon points="36,50 43,61 29,61" fill="#2B3A55" stroke="#2B3A55" stroke-width="2"/></g><text x="36" y="36" font-size="13" text-anchor="start" fill="#2B3A55">puissance (kW)</text><rect x="255" y="95" width="135" height="60" rx="8" fill="#FFFFFF" stroke="#2B3A55" stroke-width="2"/><text x="322" y="120" font-size="14" fill="#2B3A55">kWh =</text><text x="322" y="142" font-size="14" fill="#2B3A55">kW × h</text></g></svg>