<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>L’eau : solide, liquide ou gaz, une même matière</title><style>.dr{animation:dr 4s ease-in-out infinite alternate}@keyframes dr{to{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="30" width="116" height="170" rx="14" fill="#3B82F6" fill-opacity=".06" stroke="#3B82F6" stroke-width="2.5"/><text x="72" y="226" font-size="15" fill="#2B3A55">solide</text><text x="72" y="246" font-size="13" fill="#2B3A55" opacity=".8">glace</text><rect x="142" y="30" width="116" height="170" rx="14" fill="#3B82F6" fill-opacity=".06" stroke="#3B82F6" stroke-width="2.5"/><text x="200" y="226" font-size="15" fill="#2B3A55">liquide</text><text x="200" y="246" font-size="13" fill="#2B3A55" opacity=".8">flaque</text><rect x="270" y="30" width="116" height="170" rx="14" fill="#3B82F6" fill-opacity=".06" stroke="#3B82F6" stroke-width="2.5"/><text x="328" y="226" font-size="15" fill="#2B3A55">gaz</text><text x="328" y="246" font-size="13" fill="#2B3A55" opacity=".8">vapeur d’eau</text><rect x="44" y="86" width="56" height="56" rx="10" fill="#06B6D4" fill-opacity=".35" stroke="#2B3A55" stroke-width="3"/><path d="M54 98l10 -4" stroke="#FFFFFF" stroke-width="3"/><ellipse cx="200" cy="150" rx="46" ry="14" fill="#3B82F6" fill-opacity=".6" stroke="#2B3A55" stroke-width="3"/><g class="dr"><circle cx="290" cy="60" r="5" fill="#3B82F6"/><circle cx="340" cy="72" r="5" fill="#3B82F6"/><circle cx="312" cy="104" r="5" fill="#3B82F6"/><circle cx="362" cy="120" r="5" fill="#3B82F6"/><circle cx="286" cy="140" r="5" fill="#3B82F6"/><circle cx="336" cy="160" r="5" fill="#3B82F6"/><circle cx="300" cy="180" r="5" fill="#3B82F6"/><circle cx="350" cy="186" r="5" fill="#3B82F6"/></g><text x="326" y="52" font-size="13" fill="#2B3A55" opacity=".7">invisible</text></g></svg>