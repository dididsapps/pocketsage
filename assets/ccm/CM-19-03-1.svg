<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Charge basse ou haute : le centre de gravité change de place</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="150" width="400" height="110" fill="#3B82F6" opacity=".2"/><line x1="0" y1="150" x2="400" y2="150" stroke="#3B82F6" stroke-width="3"/><g transform="translate(100 140)"><path d="M-55 -30H55L44 16Q0 30 -44 16Z" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><rect x="-14" y="-8" width="28" height="28" rx="2" fill="#F59E0B" stroke="#2B3A55" stroke-width="2"/><circle cx="0" cy="6" r="6" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/></g><g transform="translate(300 140)"><path d="M-55 -30H55L44 16Q0 30 -44 16Z" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><path d="M0 -30V-96" stroke="#2B3A55" stroke-width="3"/><rect x="-14" y="-124" width="28" height="28" rx="2" fill="#F59E0B" stroke="#2B3A55" stroke-width="2"/><circle cx="0" cy="-66" r="6" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/></g><text x="100" y="60" font-size="15" fill="#2B3A55">charge en bas</text><circle cx="100" cy="84" r="11" fill="#10B981"/><path d="M94 84l4 4l7 -8" stroke="#FFFFFF" stroke-width="3" fill="none"/><text x="300" y="30" font-size="15" fill="#2B3A55">charge en haut</text><text x="360" y="60" font-size="13" fill="#EF4444">moins</text><text x="360" y="76" font-size="13" fill="#EF4444">stable</text><circle cx="60" cy="228" r="7" fill="#EF4444"/><text x="74" y="224" font-size="13" fill="#2B3A55" text-anchor="start">centre de gravité :</text><text x="74" y="241" font-size="13" fill="#2B3A55" text-anchor="start">point où l’on dessine le poids</text></g></svg>