<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Courant alternatif : 50 cycles par seconde</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><line x1="20" y1="130" x2="385" y2="130" stroke="#94A3B8" stroke-width="2"/><text x="30" y="122" font-size="13" fill="#2B3A55">0</text><rect x="60" y="48" width="140" height="164" rx="8" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="6 6"/><text x="130" y="230" font-size="14" fill="#2B3A55">1 cycle</text><path d="M60 130Q95 50 130 130T200 130T270 130T340 130" stroke="#8B5CF6" stroke-width="4" fill="none"/><circle r="7" fill="#8B5CF6"><animateMotion dur="8s" repeatCount="indefinite" path="M60 130Q95 50 130 130T200 130T270 130T340 130"/></circle><text x="290" y="40" font-size="14" fill="#2B3A55">50 cycles par seconde</text><text x="290" y="230" font-size="13" fill="#94A3B8">animation très ralentie</text></g></svg>