<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Fil en coupe : cœur en métal conducteur, enveloppe bleue autour</title><style>.fl{stroke-dasharray:0 14;animation:fl 3s linear infinite}@keyframes fl{to{stroke-dashoffset:-56}}.da{stroke-dasharray:8 8;animation:da 2s linear infinite}@keyframes da{to{stroke-dashoffset:-32}}.pu{animation:pu 3s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}.mv2{animation:mv2 2.5s linear infinite}@keyframes mv2{from{transform:translateX(-10px)}to{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="95" width="240" height="70" rx="35" fill="#3B82F6" stroke="#2B3A55" stroke-width="4"/><rect x="55" y="113" width="225" height="34" rx="17" fill="#D97745" stroke="#2B3A55" stroke-width="3"/><circle cx="80" cy="130" r="4" fill="#FFFFFF" stroke="#2B3A55" stroke-width="1.5" class="mv2"/><circle cx="110" cy="130" r="4" fill="#FFFFFF" stroke="#2B3A55" stroke-width="1.5" class="mv2"/><circle cx="140" cy="130" r="4" fill="#FFFFFF" stroke="#2B3A55" stroke-width="1.5" class="mv2"/><circle cx="170" cy="130" r="4" fill="#FFFFFF" stroke="#2B3A55" stroke-width="1.5" class="mv2"/><circle cx="200" cy="130" r="4" fill="#FFFFFF" stroke="#2B3A55" stroke-width="1.5" class="mv2"/><circle cx="230" cy="130" r="4" fill="#FFFFFF" stroke="#2B3A55" stroke-width="1.5" class="mv2"/><circle cx="260" cy="130" r="4" fill="#FFFFFF" stroke="#2B3A55" stroke-width="1.5" class="mv2"/><circle cx="320" cy="130" r="45" fill="#3B82F6" stroke="#2B3A55" stroke-width="4"/><circle cx="320" cy="130" r="22" fill="#D97745" stroke="#2B3A55" stroke-width="3"/><text x="150" y="72" font-size="15" fill="#2B3A55">conducteur</text><line x1="150" y1="78" x2="150" y2="113" stroke="#2B3A55" stroke-width="2"/><text x="150" y="205" font-size="15" fill="#2B3A55">enveloppe</text><line x1="150" y1="168" x2="150" y2="186" stroke="#2B3A55" stroke-width="2"/><text x="320" y="205" font-size="13" fill="#94A3B8">coupe</text></g></svg>