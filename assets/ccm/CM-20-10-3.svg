<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Autour du Soleil, l’axe incliné de la Terre garde la même direction</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="200" cy="120" rx="150" ry="70" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 6"/><g transform="translate(200 120)"><line x1="23" y1="0" x2="30" y2="0" stroke="#F59E0B" stroke-width="3"/><line x1="16" y1="16" x2="21" y2="21" stroke="#F59E0B" stroke-width="3"/><line x1="0" y1="23" x2="0" y2="30" stroke="#F59E0B" stroke-width="3"/><line x1="-16" y1="16" x2="-21" y2="21" stroke="#F59E0B" stroke-width="3"/><line x1="-23" y1="0" x2="-30" y2="0" stroke="#F59E0B" stroke-width="3"/><line x1="-16" y1="-16" x2="-21" y2="-21" stroke="#F59E0B" stroke-width="3"/><line x1="-0" y1="-23" x2="-0" y2="-30" stroke="#F59E0B" stroke-width="3"/><line x1="16" y1="-16" x2="21" y2="-21" stroke="#F59E0B" stroke-width="3"/><circle r="18" fill="#F59E0B"/></g><circle cx="50" cy="120" r="18" fill="#3B82F6" stroke="#2B3A55" stroke-width="3"/><path d="M41 146L59 94" stroke="#2B3A55" stroke-width="3"/><circle cx="350" cy="120" r="18" fill="#3B82F6" stroke="#2B3A55" stroke-width="3"/><path d="M341 146L359 94" stroke="#2B3A55" stroke-width="3"/><circle cx="200" cy="50" r="18" fill="#3B82F6" stroke="#2B3A55" stroke-width="3"/><path d="M191 76L209 24" stroke="#2B3A55" stroke-width="3"/><circle cx="200" cy="190" r="18" fill="#3B82F6" stroke="#2B3A55" stroke-width="3"/><path d="M191 216L209 164" stroke="#2B3A55" stroke-width="3"/><path d="M50 102a18 18 0 0 0 0 36z" fill="#2B3A55" fill-opacity=".5"/><path d="M350 102a18 18 0 0 1 0 36z" fill="#2B3A55" fill-opacity=".5"/><text x="8" y="164" font-size="12" fill="#2B3A55" text-anchor="start">nord penché</text><text x="8" y="178" font-size="12" fill="#2B3A55" text-anchor="start">vers le Soleil :</text><text x="8" y="194" font-size="12" fill="#3B82F6" text-anchor="start">jours longs au nord</text><text x="392" y="164" font-size="12" fill="#2B3A55" text-anchor="end">nord penché</text><text x="392" y="178" font-size="12" fill="#2B3A55" text-anchor="end">à l’opposé :</text><text x="392" y="194" font-size="12" fill="#3B82F6" text-anchor="end">jours courts au nord</text><text x="200" y="228" font-size="13" fill="#2B3A55">axe incliné, même direction</text><text x="200" y="252" font-size="12" fill="#2B3A55" opacity=".7">pas à l’échelle</text></g></svg>