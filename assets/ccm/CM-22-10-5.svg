<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Les priorités : éviter, utiliser longtemps, réemployer, trier</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="110" width="150" height="28" rx="6" fill="#10B981" stroke="#2B3A55" stroke-width="3" fill-opacity=".3"/><text x="30" y="129" font-size="13" fill="#2B3A55" text-anchor="start">1. éviter</text><rect x="76" y="144" width="150" height="28" rx="6" fill="#06B6D4" stroke="#2B3A55" stroke-width="3" fill-opacity=".3"/><text x="86" y="163" font-size="13" fill="#2B3A55" text-anchor="start">2. utiliser longtemps</text><rect x="132" y="178" width="150" height="28" rx="6" fill="#3B82F6" stroke="#2B3A55" stroke-width="3" fill-opacity=".3"/><text x="142" y="197" font-size="13" fill="#2B3A55" text-anchor="start">3. réemployer</text><rect x="188" y="212" width="150" height="28" rx="6" fill="#F59E0B" stroke="#2B3A55" stroke-width="3" fill-opacity=".3"/><text x="198" y="231" font-size="13" fill="#2B3A55" text-anchor="start">4. trier</text><rect x="250" y="10" width="140" height="90" rx="12" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="7 6"/><rect x="295" y="38" width="50" height="12" rx="4" fill="#F59E0B" stroke="#2B3A55" stroke-width="3"/><path d="M300 50L340 50L334 90L306 90Z" stroke="#2B3A55" stroke-width="3" fill="#F59E0B"/><path d="M314 62V78 M326 62V78" stroke="#2B3A55" stroke-width="2" fill="none"/><rect x="312" y="24" width="14" height="12" rx="3" fill="#FFFFFF" stroke="#2B3A55" stroke-width="2.5"/><path d="M361 40L367 47L380 32" stroke="#10B981" stroke-width="4" fill="none"/><text x="320" y="118" font-size="13" fill="#2B3A55">peu de déchets</text><text x="320" y="134" font-size="13" fill="#2B3A55">bien orientés</text></g></svg>