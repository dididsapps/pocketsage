<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Entrées 100 euros, sorties 85 euros, différence 15 euros sur le même mois</title><style>.g{animation:g 3s infinite}@keyframes g{50%{opacity:.5}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><text x="200" y="36" font-size="15" fill="#2B3A55">même mois</text><text x="30" y="82" font-size="14" fill="#2B3A55" text-anchor="start">entrées</text><rect x="30" y="90" width="300" height="30" rx="4" fill="#3B82F6" stroke="#3B82F6" stroke-width="2"/><text x="180" y="111" font-size="15" fill="#FFFFFF">100 €</text><text x="30" y="160" font-size="14" fill="#2B3A55" text-anchor="start">sorties</text><rect x="30" y="168" width="255" height="30" rx="4" fill="#F59E0B" stroke="#F59E0B" stroke-width="2"/><text x="157" y="189" font-size="15" fill="#FFFFFF">85 €</text><rect x="285" y="168" width="45" height="30" rx="4" fill="#10B981" stroke="#10B981" stroke-width="2" class="g"/><text x="308" y="189" font-size="14" fill="#FFFFFF">15 €</text><line x1="285" y1="130" x2="285" y2="222" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 5"/><line x1="330" y1="130" x2="330" y2="222" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 5"/><text x="355" y="240" font-size="14" fill="#10B981">différence</text></g></svg>