<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Ballon en coupe : eau chaude en haut, eau froide en bas</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset=".15" stop-color="#F97316"/><stop offset=".85" stop-color="#3B82F6"/></linearGradient></defs><rect x="140" y="30" width="120" height="200" rx="30" fill="url(#g)" stroke="#2B3A55" stroke-width="3" fill-opacity=".75"/><g><line x1="40" y1="206" x2="128.7" y2="206" stroke="#3B82F6" stroke-width="4"/><polygon points="136,206 125.6,212.8 125.6,199.2" fill="#3B82F6" stroke="#3B82F6" stroke-width="2"/></g><text x="70" y="194" font-size="13" fill="#2B3A55">arrivée froide</text><g><line x1="264" y1="54" x2="362.7" y2="54" stroke="#F97316" stroke-width="4"/><polygon points="370,54 359.6,60.8 359.6,47.2" fill="#F97316" stroke="#F97316" stroke-width="2"/></g><text x="330" y="42" font-size="13" fill="#2B3A55">sortie chaude</text><text x="200" y="80" font-size="14" fill="#FFFFFF">chaud</text><text x="200" y="190" font-size="14" fill="#FFFFFF">froid</text><text x="330" y="150" font-size="13" fill="#94A3B8">modèle</text><text x="330" y="167" font-size="13" fill="#94A3B8">simplifié</text></g></svg>