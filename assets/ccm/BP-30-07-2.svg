<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Fiche du rôle : tâches, accompagnement, horaires, étapes ; les cases sans réponse restent ouvertes</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="50" y="16" width="300" height="232" rx="12" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><text x="200" y="44" font-size="15" fill="#2B3A55">le rôle</text><text x="74" y="84" font-size="14" fill="#2B3A55" text-anchor="start">tâches</text><rect x="230" y="64" width="100" height="28" rx="8" fill="#10B981" fill-opacity=".14" stroke="#10B981" stroke-width="2.5"/><g transform="translate(280 78) scale(0.85)"><circle r="10" fill="#10B981"/><path d="M-5 0L-1 4L5 -4" stroke="#FFFFFF" stroke-width="2.5" fill="none"/></g><text x="74" y="128" font-size="14" fill="#2B3A55" text-anchor="start">accompagnement</text><rect x="230" y="108" width="100" height="28" rx="8" fill="#10B981" fill-opacity=".14" stroke="#10B981" stroke-width="2.5"/><g transform="translate(280 122) scale(0.85)"><circle r="10" fill="#10B981"/><path d="M-5 0L-1 4L5 -4" stroke="#FFFFFF" stroke-width="2.5" fill="none"/></g><text x="74" y="172" font-size="14" fill="#2B3A55" text-anchor="start">horaires</text><rect x="230" y="152" width="100" height="28" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="5 5"/><text x="280" y="172" font-size="16" fill="#F59E0B">?</text><text x="74" y="216" font-size="14" fill="#2B3A55" text-anchor="start">étapes</text><rect x="230" y="196" width="100" height="28" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="5 5"/><text x="280" y="216" font-size="16" fill="#F59E0B">?</text><text x="200" y="240" font-size="13" fill="#F59E0B">sans réponse : ouvert</text></g></svg>