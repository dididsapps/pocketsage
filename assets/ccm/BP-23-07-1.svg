<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Deux bulles : un fait précis encadré en bleu, une étiquette générale en gris</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(60 170) scale(0.9)"><path d="M-20 -26H2L-4 -10L4 2L-2 26H-20Z" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><path d="M8 -26H22V26H4L10 2L2 -10Z" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3" transform="rotate(8 14 0)"/></g><g><path d="M72 94L80 135L88 94Z" fill="#FFFFFF" stroke="#3B82F6" stroke-width="4"/><rect x="25" y="44" width="170" height="52" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="4"/><rect x="73" y="94" width="14" height="4" fill="#FFFFFF"/><text x="110" y="66.4" font-size="14" fill="#2B3A55">Mon dessin</text><text x="110" y="83.4" font-size="14" fill="#2B3A55">est abîmé.</text></g><g><path d="M292 94L300 135L308 94Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/><rect x="215" y="44" width="170" height="52" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3" stroke-dasharray="7 6"/><rect x="293" y="94" width="14" height="4" fill="#FFFFFF"/><text x="300" y="66.4" font-size="14" fill="#2B3A55">Tu es toujours</text><text x="300" y="83.4" font-size="14" fill="#2B3A55">horrible !</text></g><path d="M290 130h20" stroke="#FFFFFF" stroke-width="2"/><text x="110" y="220" font-size="15" fill="#3B82F6">fait précis</text><text x="300" y="220" font-size="15" fill="#94A3B8">étiquette</text><text x="300" y="240" font-size="13" fill="#94A3B8">générale</text></g></svg>