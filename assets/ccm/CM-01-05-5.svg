<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Une coupure peut concerner une seule zone : appareil, logement, immeuble ou quartier</title><style>.z{animation:z 8s steps(1) infinite}@keyframes z{0%{fill:#94A3B8}25%,100%{fill:#FEF3C7}}.z0{animation-delay:0s}.z1{animation-delay:2s}.z2{animation-delay:4s}.z3{animation-delay:6s}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="20" width="280" height="230" rx="10" fill="#FEF3C7" stroke="#2B3A55" stroke-width="2" class="z z0"/><text x="20" y="40" font-size="13" text-anchor="start" fill="#2B3A55">quartier</text><rect x="30" y="50" width="240" height="190" rx="10" fill="#FEF3C7" stroke="#2B3A55" stroke-width="2" class="z z1"/><text x="40" y="70" font-size="13" text-anchor="start" fill="#2B3A55">immeuble</text><rect x="50" y="80" width="200" height="150" rx="10" fill="#FEF3C7" stroke="#2B3A55" stroke-width="2" class="z z2"/><text x="60" y="100" font-size="13" text-anchor="start" fill="#2B3A55">logement</text><rect x="70" y="110" width="160" height="110" rx="10" fill="#FEF3C7" stroke="#2B3A55" stroke-width="2" class="z z3"/><text x="80" y="130" font-size="13" text-anchor="start" fill="#2B3A55">appareil</text><rect x="142" y="191" width="16" height="11" rx="2" fill="#94A3B8" stroke="#2B3A55" stroke-width="3"/><circle cx="150" cy="180" r="14" fill="#F59E0B" stroke="#2B3A55" stroke-width="3"/><circle cx="345" cy="110" r="26" fill="#FFFFFF" stroke="#2B3A55" stroke-width="4"/><line x1="364" y1="129" x2="384" y2="150" stroke="#2B3A55" stroke-width="7"/><text x="345" y="180" font-size="14" fill="#2B3A55">indice</text></g></svg>