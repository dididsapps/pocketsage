<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>La sous-partie est incluse dans le total : on n’additionne pas</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="30" width="170" height="140" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3"/><text x="105" y="54" font-size="13" fill="#2B3A55">matières grasses</text><rect x="70" y="98" width="100" height="56" rx="8" fill="#FDE68A" stroke="#2B3A55" stroke-width="3"/><text x="120" y="124" font-size="12" fill="#2B3A55">dont</text><text x="120" y="141" font-size="13" fill="#2B3A55">saturés</text><rect x="210" y="30" width="170" height="140" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="295" y="54" font-size="13" fill="#2B3A55">glucides</text><rect x="260" y="98" width="100" height="56" rx="8" fill="#BFDBFE" stroke="#2B3A55" stroke-width="3"/><text x="310" y="124" font-size="12" fill="#2B3A55">dont</text><text x="310" y="141" font-size="13" fill="#2B3A55">sucres</text><text x="160" y="208" font-size="15" fill="#2B3A55">total</text><text x="200" y="209" font-size="20" fill="#2B3A55">+</text><text x="244" y="208" font-size="15" fill="#2B3A55">partie</text><line x1="136" y1="203" x2="276" y2="203" stroke="#EF4444" stroke-width="2"/><text x="206" y="234" font-size="13" fill="#EF4444">on n’additionne pas</text><text x="200" y="254" font-size="13" fill="#94A3B8">la partie est déjà dans le total</text></g></svg>