<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Trois réglages possibles : un seul est choisi pour l’essai suivant, les autres attendent</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><text x="110" y="28" font-size="14" fill="#2B3A55">réglages possibles</text><rect x="14" y="42" width="196" height="52" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/><circle cx="38" cy="68" r="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/><text x="56" y="73" font-size="13" fill="#94A3B8" text-anchor="start">raccourcir l’exemple</text><rect x="14" y="108" width="196" height="52" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="4"/><circle cx="38" cy="134" r="10" fill="#10B981" stroke="#10B981" stroke-width="3"/><text x="56" y="139" font-size="13" fill="#2B3A55" text-anchor="start">expliquer un mot</text><rect x="14" y="174" width="196" height="52" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/><circle cx="38" cy="200" r="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/><text x="56" y="205" font-size="13" fill="#94A3B8" text-anchor="start">ajouter une pause</text><g><line x1="214" y1="134" x2="262" y2="134" stroke="#10B981" stroke-width="4"/><path d="M252.3 139.3L262 134L252.3 128.7" fill="none" stroke="#10B981" stroke-width="4"/></g><rect x="268" y="96" width="120" height="76" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="4"/><text x="328" y="128" font-size="15" fill="#2B3A55">essai</text><text x="328" y="148" font-size="15" fill="#2B3A55">suivant</text><text x="300" y="218" font-size="13" fill="#94A3B8">les autres :</text><text x="300" y="236" font-size="13" fill="#94A3B8">plus tard</text></g></svg>