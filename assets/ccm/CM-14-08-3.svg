<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Noter l’heure du premier signe ; alerter même si le signe disparaît</title><style>.al{animation:al 2s linear infinite}@keyframes al{to{stroke-dashoffset:-24}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><circle cx="64" cy="80" r="40" fill="#FFFFFF" stroke="#2B3A55" stroke-width="3"/><path d="M64 80V56M64 80L80 90" stroke="#2B3A55" stroke-width="3" fill="none"/><text x="64" y="144" font-size="13" fill="#2B3A55">heure du début</text><path d="M120 80H140l8-30 8 54 8-46 8 30 6-14 6 14 4-6 4 6H230" stroke="#EF4444" stroke-width="3" fill="none"/><path d="M230 80H300" stroke="#94A3B8" stroke-width="3" fill="none" stroke-dasharray="4 6"/><text x="210" y="40" font-size="13" fill="#EF4444">signe qui disparaît</text><path d="M64 164V210H290" stroke="#10B981" stroke-width="5" fill="none" stroke-dasharray="12 12" class="al"/><g><line x1="280" y1="210" x2="298.0" y2="210.0" stroke="#10B981" stroke-width="5"/><polygon points="306,210 296.0,216.0 296.0,204.0" fill="#10B981" stroke="#10B981" stroke-width="2"/></g><text x="170" y="232" font-size="13" fill="#10B981">alerter quand même</text><rect x="310" y="170" width="80" height="78" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/><rect x="338" y="189" width="24" height="40" rx="5" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/><path d="M346 223H354" stroke="#10B981" stroke-width="2" fill="none"/><text x="350" y="160" font-size="13" fill="#10B981">secours</text></g></svg>