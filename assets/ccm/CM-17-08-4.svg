<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img"><title>Protection différentielle : elle compare ce qui entre et ce qui revient ; un écart provoque l’arrêt</title><style>.fl{stroke-dasharray:0 14;animation:fl 3s linear infinite}@keyframes fl{to{stroke-dashoffset:-56}}.da{stroke-dasharray:8 8;animation:da 2s linear infinite}@keyframes da{to{stroke-dashoffset:-32}}.pu{animation:pu 3s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}.rt{animation:rt 5s infinite}@keyframes rt{0%,30%,90%,100%{opacity:1}45%,80%{opacity:.35}}.bm{transform-origin:200px 155px;animation:bm 5s infinite}@keyframes bm{0%,30%,90%,100%{transform:rotate(0)}45%,80%{transform:rotate(-8deg)}}.vy{animation:vy 5s infinite}@keyframes vy{0%,45%,90%,100%{fill:#E2E8F0}52%,80%{fill:#EF4444}}.al{animation:al 5s infinite}@keyframes al{0%,48%,90%,100%{opacity:0}55%,80%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round"><rect x="130" y="40" width="140" height="100" rx="10" fill="#E2E8F0" stroke="#2B3A55" stroke-width="3"/><g><line x1="30" y1="70" x2="110.6" y2="70" stroke="#F97316" stroke-width="6"/><polygon points="128.0,70.0 110.6,59.6 110.6,80.4" fill="#F97316" stroke="#F97316" stroke-width="2"/></g><g class="rt" opacity=".35"><line x1="128" y1="110" x2="47.4" y2="110" stroke="#F97316" stroke-width="6"/><polygon points="30.0,110.0 47.4,120.4 47.4,99.6" fill="#F97316" stroke="#F97316" stroke-width="2"/></g><text x="70" y="55" font-size="13" fill="#2B3A55">entre</text><text x="70" y="135" font-size="13" fill="#2B3A55">revient</text><line x1="200" y1="155" x2="200" y2="215" stroke="#2B3A55" stroke-width="3"/><path d="M190 220h20l-10 -10z" stroke="#2B3A55" stroke-width="2" fill="#2B3A55"/><g class="bm" transform="rotate(-8)"><line x1="150" y1="155" x2="250" y2="155" stroke="#2B3A55" stroke-width="4"/><circle cx="150" cy="160" r="9" fill="#F97316" stroke="#2B3A55" stroke-width="2"/><circle cx="250" cy="160" r="9" fill="#F97316" stroke="#2B3A55" stroke-width="2"/></g><circle cx="245" cy="65" r="10" fill="#EF4444" stroke="#2B3A55" stroke-width="3" class="vy"/><g class="al"><text x="330" y="95" font-size="15" fill="#EF4444">arrêt</text><g transform="translate(330 60) scale(0.8)"><path d="M0 -16L15 11H-15Z" stroke="#EF4444" stroke-width="3" fill="#FFFFFF"/><line x1="0" y1="-6" x2="0" y2="2" stroke="#EF4444" stroke-width="3.5"/><circle cx="0" cy="6.5" r="1.5" fill="#EF4444" stroke="#EF4444" stroke-width="1"/></g></g><text x="200" y="245" font-size="13" fill="#94A3B8">comparaison</text></g></svg>